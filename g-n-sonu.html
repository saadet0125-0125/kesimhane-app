<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gün Sonu Raporu — Kesimhane</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          background: 'rgb(244 247 248 / <alpha-value>)',
          foreground: 'rgb(23 36 45 / <alpha-value>)',
          primary: { DEFAULT: 'rgb(18 48 71 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          secondary: { DEFAULT: 'rgb(221 235 233 / <alpha-value>)', foreground: 'rgb(18 63 61 / <alpha-value>)' },
          accent: { DEFAULT: 'rgb(184 106 0 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          card: { DEFAULT: 'rgb(255 255 255 / <alpha-value>)', foreground: 'rgb(23 36 45 / <alpha-value>)' },
          border: 'rgb(201 213 217 / <alpha-value>)',
          muted: { DEFAULT: 'rgb(232 238 240 / <alpha-value>)', foreground: 'rgb(83 99 109 / <alpha-value>)' },
          success: { DEFAULT: 'rgb(44 110 73 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          destructive: { DEFAULT: 'rgb(180 35 24 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' }
        },
        fontFamily: { body: ['Inter', 'system-ui'] },
        borderRadius: { DEFAULT: '14px' }
      }}
    };
  </script>
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
</head>
<body class="bg-background text-foreground min-h-screen font-body pb-36">

  <header class="px-5 pb-4 pt-8 flex justify-between items-center">
    <div>
      <p class="text-xs font-semibold text-muted-foreground">Raporlama ve Muhasebe</p>
      <h1 class="text-2xl font-bold text-foreground">Gün Sonu Raporu</h1>
    </div>
    <div class="flex items-center gap-2">
      <button id="toggle-arsiv-btn" class="text-xs font-bold bg-secondary text-secondary-foreground px-3 py-2 rounded-xl shadow-sm hover:opacity-90 transition-all flex items-center gap-1.5">
        <iconify-icon icon="lucide:archive" class="text-sm"></iconify-icon>
        <span id="arsiv-btn-text">Arşivi Göster</span>
      </button>
      <input type="date" id="tarih-secici" class="text-xs font-bold text-primary bg-card border border-border px-3 py-2 rounded-xl outline-none shadow-sm cursor-pointer">
    </div>
  </header>

  <main class="px-5 space-y-4">
    <!-- TABLO YAPISI -->
    <div class="bg-card border border-border rounded-2xl shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-primary text-primary-foreground text-xs font-bold">
              <th class="p-3.5">Müşteri Adı</th>
              <th class="p-3.5">Telefon</th>
              <th class="p-3.5">IBAN</th>
              <th class="p-3.5">Kesim Türü</th>
              <th class="p-3.5 text-right">Tutar</th>
              <th class="p-3.5 text-center">İşlem</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-border text-xs">
            <!-- Dinamik Satırlar -->
          </tbody>
        </table>
      </div>

      <!-- ALT ÖZET BÖLÜMÜ -->
      <div class="p-5 bg-muted/20 border-t border-border space-y-2 max-w-sm ml-auto">
        <div class="flex justify-between items-center text-xs">
          <span class="text-muted-foreground font-semibold">Standart Kesim Ödemesi:</span>
          <span id="standart-toplam" class="font-bold text-foreground">0,00 TL</span>
        </div>
        <div class="flex justify-between items-center text-xs">
          <span class="text-muted-foreground font-semibold">Faturalı Kesim Ödemesi:</span>
          <span id="faturali-toplam" class="font-bold text-foreground">0,00 TL</span>
        </div>
        <div class="flex justify-between items-center text-sm pt-2 border-t border-border">
          <span class="font-bold text-foreground">Toplam Ödenecek Tutar:</span>
          <span id="genel-toplam" class="font-extrabold text-success text-base">0,00 TL</span>
        </div>
      </div>
    </div>

    <!-- GÜNÜ KAPAT VE SİSTEMDEN ÇIKIŞ BÖLÜMÜ -->
    <div class="bg-card border border-border rounded-2xl p-4 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-3">
      <button id="gunu-kapat-btn" class="w-full sm:w-auto bg-primary text-primary-foreground font-bold px-4 py-2.5 rounded-xl text-xs shadow hover:opacity-90 flex items-center justify-center gap-1.5">
        <iconify-icon icon="lucide:lock" class="text-base"></iconify-icon> Günü Kapat ve Kilitle
      </button>
      <button id="sistemden-cikis-btn" class="w-full sm:w-auto bg-destructive/10 text-destructive font-bold px-4 py-2.5 rounded-xl text-xs hover:bg-destructive hover:text-white transition-all flex items-center justify-center gap-1.5">
        <iconify-icon icon="lucide:log-out" class="text-base"></iconify-icon> Güvenli Sistemden Çıkış Yap
      </button>
    </div>
  </main>

  <!-- BİLGİ DÜZENLEME MODALI -->
  <div id="bilgi-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-card border border-border rounded-2xl p-5 max-w-sm w-full space-y-4 shadow-xl">
      <h3 class="font-bold text-sm text-foreground flex items-center gap-2">
        <iconify-icon icon="lucide:user-pen" class="text-primary text-lg"></iconify-icon> Müşteri Bilgilerini Düzenle
      </h3>
      <input type="hidden" id="modal-item-id">
      <div class="space-y-1">
        <label class="text-[11px] font-semibold text-muted-foreground">Telefon</label>
        <input type="text" id="modal-telefon" class="w-full text-xs bg-background border border-border rounded-xl px-3 py-2 outline-none font-bold text-foreground">
      </div>
      <div class="space-y-1">
        <label class="text-[11px] font-semibold text-muted-foreground">IBAN</label>
        <input type="text" id="modal-iban" class="w-full text-xs bg-background border border-border rounded-xl px-3 py-2 outline-none font-bold text-foreground font-mono">
      </div>
      <div class="flex gap-2 pt-2">
        <button id="modal-iptal" class="w-1/2 bg-muted text-muted-foreground font-bold py-2 rounded-xl text-xs hover:opacity-90">İptal</button>
        <button id="modal-kaydet" class="w-1/2 bg-primary text-primary-foreground font-bold py-2 rounded-xl text-xs hover:opacity-90">Kaydet</button>
      </div>
    </div>
  </div>

  <!-- ALT NAVİGASYON -->
  <nav class="fixed inset-x-0 bottom-0 z-20 border-t border-border bg-card px-2 pb-4 pt-2 shadow-lg">
    <div class="mx-auto flex max-w-md items-center justify-between">
      <a href="ana-sayfa.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:house" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Ana Sayfa</span>
      </a>
      <a href="kesim-listesi.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:clipboard-list" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Kesim Listesi</span>
      </a>
      <a href="stok.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:package" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Stok</span>
      </a>
      <a href="sevkiyat.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:truck" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Sevkiyat</span>
      </a>
      <a href="g-n-sonu.html" class="flex flex-col items-center gap-1 rounded-lg bg-primary px-3 py-1.5 text-primary-foreground">
        <iconify-icon icon="lucide:circle-check-big" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Gün Sonu</span>
      </a>
    </div>
  </nav>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const tarihSecici = document.getElementById('tarih-secici');
      const tableBody = document.getElementById('table-body');
      const toggleArsivBtn = document.getElementById('toggle-arsiv-btn');
      const arsivBtnText = document.getElementById('arsiv-btn-text');

      const standartToplamEl = document.getElementById('standart-toplam');
      const faturaliToplamEl = document.getElementById('faturali-toplam');
      const genelToplamEl = document.getElementById('genel-toplam');

      const gunuKapatBtn = document.getElementById('gunu-kapat-btn');
      const sistemdenCikisBtn = document.getElementById('sistemden-cikis-btn');

      const modal = document.getElementById('bilgi-modal');
      const modalItemId = document.getElementById('modal-item-id');
      const modalTelefon = document.getElementById('modal-telefon');
      const modalIban = document.getElementById('modal-iban');
      const modalIptal = document.getElementById('modal-iptal');
      const modalKaydet = document.getElementById('modal-kaydet');

      const simdi = new Date();
      const bugunStr = `${simdi.getFullYear()}-${String(simdi.getMonth() + 1).padStart(2, '0')}-${String(simdi.getDate()).padStart(2, '0')}`;
      tarihSecici.value = bugunStr;

      let gosterilenArsiv = false;

      toggleArsivBtn.addEventListener('click', () => {
        gosterilenArsiv = !gosterilenArsiv;
        if (gosterilenArsiv) {
          arsivBtnText.textContent = "Aktif Raporu Göster";
          toggleArsivBtn.classList.remove('bg-secondary', 'text-secondary-foreground');
          toggleArsivBtn.classList.add('bg-accent', 'text-accent-foreground');
        } else {
          arsivBtnText.textContent = "Arşivi Göster";
          toggleArsivBtn.classList.remove('bg-accent', 'text-accent-foreground');
          toggleArsivBtn.classList.add('bg-secondary', 'text-secondary-foreground');
        }
        raporuGuncelle();
      });

      tarihSecici.addEventListener('change', raporuGuncelle);

      window.odemeyiIsaretle = function(id) {
        let tumStoklar = JSON.parse(localStorage.getItem('stoklar')) || [];
        tumStoklar = tumStoklar.map(item => {
          // ID karşılaştırmasını string/number esnek yapıyoruz
          if (String(item.id) === String(id)) {
            item.odendi = true;
          }
          return item;
        });
        localStorage.setItem('stoklar', JSON.stringify(tumStoklar));
        raporuGuncelle();
      };

      window.bilgiDuzenleAc = function(id, mevcutTel, mevcutIban) {
        modalItemId.value = id;
        modalTelefon.value = mevcutTel !== '-' ? mevcutTel : '';
        modalIban.value = mevcutIban !== '-' ? mevcutIban : '';
        modal.classList.remove('hidden');
      };

      modalIptal.addEventListener('click', () => modal.classList.add('hidden'));

      modalKaydet.addEventListener('click', () => {
        const id = modalItemId.value;
        const yeniTel = modalTelefon.value.trim();
        const yeniIban = modalIban.value.trim();

        let tumStoklar = JSON.parse(localStorage.getItem('stoklar')) || [];
        tumStoklar = tumStoklar.map(item => {
          if (String(item.id) === String(id)) {
            item.telefon = yeniTel;
            item.iban = yeniIban;
          }
          return item;
        });
        localStorage.setItem('stoklar', JSON.stringify(tumStoklar));
        modal.classList.add('hidden');
        raporuGuncelle();
      });

      gunuKapatBtn.addEventListener('click', function() {
        const secilenTarih = tarihSecici.value;
        if (confirm(`${secilenTarih} tarihli gün sonu raporu kapatılacak ve kilitlenecek. Emin misiniz?`)) {
          alert("Gün başarıyla kapatıldı.");
        }
      });

      sistemdenCikisBtn.addEventListener('click', function() {
        if (confirm("Sistemden çıkış yapmak istediğinize emin misiniz? (Kesim, stok ve sevkiyat verileriniz güvende kalacaktır)")) {
          localStorage.removeItem('aktifKullaniciOturumu');
          alert("Başarıyla çıkış yapıldı.");
          window.location.href = 'index.html';
        }
      });

      function raporuGuncelle() {
        let tumStoklar = JSON.parse(localStorage.getItem('stoklar')) || [];
        const kesimListesi = JSON.parse(localStorage.getItem('kesimListesi')) || [];
        const musteriler = JSON.parse(localStorage.getItem('musteriler')) || [];

        let veriDegisti = false;

        // Eksik ID'lere benzersiz ID atama ve telefon/iban bilgilerini kalıcı eşleştirme
        tumStoklar = tumStoklar.map((item, index) => {
          if (!item.id) {
            item.id = 'stok_' + Date.now() + '_' + index;
            veriDegisti = true;
          }

          const musteriAdi = item.musteri || item.musteriAdi || '';

          // Eğer kayıtta telefon/iban yoksa kesimListesi veya musteriler'den bulup kalıcı yazalım
          if ((!item.telefon || item.telefon === '-') && musteriAdi) {
            const kBul = kesimListesi.find(k => (k.musteri === musteriAdi || k.musteriAdi === musteriAdi) && (k.telefon || k.tel || k.gsm));
            const mBul = musteriler.find(m => (m.ad === musteriAdi || m.musteriAdi === musteriAdi) && (m.telefon || m.tel || m.gsm));
            const bulunanTel = (kBul ? (kBul.telefon || kBul.tel || kBul.gsm) : null) || (mBul ? (mBul.telefon || mBul.tel || mBul.gsm) : null);
            if (bulunanTel) {
              item.telefon = bulunanTel;
              veriDegisti = true;
            }
          }

          if ((!item.iban || item.iban === '-') && musteriAdi) {
            const kBul = kesimListesi.find(k => (k.musteri === musteriAdi || k.musteriAdi === musteriAdi) && k.iban);
            const mBul = musteriler.find(m => (m.ad === musteriAdi || m.musteriAdi === musteriAdi) && m.iban);
            const bulunanIban = (kBul ? kBul.iban : null) || (mBul ? mBul.iban : null);
            if (bulunanIban) {
              item.iban = bulunanIban;
              veriDegisti = true;
            }
          }

          return item;
        });

        if (veriDegisti) {
          localStorage.setItem('stoklar', JSON.stringify(tumStoklar));
        }

        const secilenTarih = tarihSecici.value;

        const filtrelenmis = tumStoklar.filter(item => {
          const itemTarih = item.tarih || bugunStr;
          const odemeDurumu = gosterilenArsiv ? (item.odendi === true) : (!item.odendi);
          return itemTarih === secilenTarih && odemeDurumu;
        });

        if (filtrelenmis.length === 0) {
          tableBody.innerHTML = `
            <tr>
              <td colspan="6" class="p-6 text-center text-muted-foreground text-xs">
                ${gosterilenArsiv ? 'Arşivde bu tarihe ait ödenmiş kayıt bulunmuyor.' : 'Seçilen tarih için ödenmeyi bekleyen kayıt bulunmuyor.'}
              </td>
            </tr>
          `;
          standartToplamEl.textContent = '0,00 TL';
          faturaliToplamEl.textContent = '0,00 TL';
          genelToplamEl.textContent = '0,00 TL';
          return;
        }

        let standartToplam = 0;
        let faturaliToplam = 0;

        tableBody.innerHTML = filtrelenmis.map(item => {
          const tutar = parseFloat(item.maliyet || 0);
          const isFaturali = (item.kesimTipi && item.kesimTipi.includes('Faturalı')) || (item.cins && item.cins.includes('Faturalı'));
          
          const musteriAdi = item.musteri || item.musteriAdi || '-';
          const telefonNumarasi = item.telefon || '-';
          const ibanNumarasi = item.iban || '-';
          const kesimTuruStr = item.kesimTipi || item.cins || 'Standart Kesim';

          if (isFaturali) {
            faturaliToplam += tutar;
          } else {
            standartToplam += tutar;
          }

          return `
            <tr class="hover:bg-muted/35 transition-colors">
              <td class="p-3.5 font-bold text-foreground">${musteriAdi}</td>
              <td class="p-3.5 text-muted-foreground">${telefonNumarasi}</td>
              <td class="p-3.5 text-muted-foreground font-mono text-[11px]">${ibanNumarasi}</td>
              <td class="p-3.5">
                <span class="px-2 py-0.5 rounded text-[10px] font-bold ${isFaturali ? 'bg-accent/10 text-accent' : 'bg-primary/10 text-primary'}">
                  ${kesimTuruStr}
                </span>
              </td>
              <td class="p-3.5 text-right font-extrabold text-foreground">${tutar.toLocaleString('tr-TR', {minimumFractionDigits: 2})} TL</td>
              <td class="p-3.5 text-center flex items-center justify-center gap-1.5">
                <button onclick="bilgiDuzenleAc('${item.id}', '${telefonNumarasi}', '${ibanNumarasi}')" class="bg-secondary text-secondary-foreground p-1.5 rounded-lg hover:opacity-90 shadow-sm" title="Telefon / IBAN Düzenle">
                  <iconify-icon icon="lucide:pencil" class="text-sm"></iconify-icon>
                </button>
                ${!gosterilenArsiv ? `
                  <button onclick="odemeyiIsaretle('${item.id}')" class="bg-success text-success-foreground text-[10px] font-bold px-2.5 py-1.5 rounded-lg hover:opacity-90 shadow-sm">
                    Ödeme Yapıldı
                  </button>
                ` : `
                  <span class="text-success font-bold text-[10px] bg-success/10 px-2 py-1.5 rounded">Arşivlendi</span>
                `}
              </td>
            </tr>
          `;
        }).join('');

        standartToplamEl.textContent = `${standartToplam.toLocaleString('tr-TR', {minimumFractionDigits: 2})} TL`;
        faturaliToplamEl.textContent = `${faturaliToplam.toLocaleString('tr-TR', {minimumFractionDigits: 2})} TL`;
        genelToplamEl.textContent = `${(standartToplam + faturaliToplam).toLocaleString('tr-TR', {minimumFractionDigits: 2})} TL`;
      }

      raporuGuncelle();
    });
  </script>
</body>
</html>
