<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gün Sonu — Kesimhane</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          background: 'rgb(244 247 248 / <alpha-value>)',
          foreground: 'rgb(23 36 45 / <alpha-value>)',
          primary: { DEFAULT: 'rgb(18 48 71 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          secondary: { DEFAULT: 'rgb(221 235 233 / <alpha-value>)', foreground: 'rgb(18 63 61 / <alpha-value>)' },
          accent: { DEFAULT: 'rgb(184 106 0 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          card: { DEFAULT: 'rgb(255 255 255 / <alpha-value>)', foreground: 'rgb(23 36 45 / <alpha-value>)' },
          border: 'rgb(201 213 217 / <alpha-value>)',
          muted: { DEFAULT: 'rgb(232 238 240 / <alpha-value>)', foreground: 'rgb(83 99 109 / <alpha-value>)' },
          success: { DEFAULT: 'rgb(44 110 73 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          destructive: { DEFAULT: 'rgb(180 35 24 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' }
        },
        fontFamily: { body: ['Inter', 'system-ui'] },
        borderRadius: { DEFAULT: '14px' }
      }}
    };
  </script>
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
</head>
<body class="bg-background text-foreground min-h-screen font-body pb-28">

  <header class="px-5 pb-4 pt-8">
    <p class="text-xs font-semibold text-muted-foreground">Raporlama ve Muhasebe</p>
    <h1 class="text-2xl font-bold text-foreground">Gün Sonu Raporu</h1>
  </header>

  <main class="px-5 space-y-4">
    <!-- MALİ ÖZET KARTLARI -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
      <div class="bg-card border border-border p-4 rounded-2xl shadow-sm">
        <span class="text-xs font-bold text-muted-foreground block">Toplam Ham Tutar</span>
        <strong id="gs-ham-tutar" class="text-lg text-foreground block mt-1">0,00 TL</strong>
      </div>

      <div class="bg-card border border-border p-4 rounded-2xl shadow-sm">
        <span class="text-xs font-bold text-accent block">Toplam Hesaplanan KDV (+%1)</span>
        <strong id="gs-kdv-tutar" class="text-lg text-accent block mt-1">0,00 TL</strong>
      </div>

      <div class="bg-card border border-border p-4 rounded-2xl shadow-sm">
        <span class="text-xs font-bold text-destructive block">Toplam Kesilen Stopaj (-%1.5)</span>
        <strong id="gs-stopaj-tutar" class="text-lg text-destructive block mt-1">0,00 TL</strong>
      </div>
    </div>

    <div class="bg-primary text-primary-foreground p-4 rounded-2xl shadow-md flex justify-between items-center">
      <div>
        <span class="text-xs opacity-80 block font-semibold">Net Genel Toplam</span>
        <strong id="gs-net-tutar" class="text-xl font-extrabold block mt-0.5">0,00 TL</strong>
      </div>
      <iconify-icon icon="lucide:wallet" class="text-3xl opacity-80"></iconify-icon>
    </div>

    <!-- KESİM TİPLERİ BAZINDA ÖZET LİSTE -->
    <section class="space-y-4">
      <!-- Standart Kesimler -->
      <div class="bg-card border border-border rounded-2xl p-4 shadow-sm space-y-3">
        <div class="flex justify-between items-center border-b border-border pb-2">
          <h3 class="text-xs font-bold text-foreground flex items-center gap-2">
            <iconify-icon icon="lucide:file-text" class="text-primary"></iconify-icon>
            Standart Kesim (%1.5 Stopaj Dâhil)
          </h3>
          <span id="std-count-label" class="text-[10px] font-semibold text-muted-foreground bg-muted px-2 py-0.5 rounded">0 Kayıt</span>
        </div>
        <div id="std-list-container" class="space-y-2">
          <!-- Standart liste buraya gelecek -->
        </div>
      </div>

      <!-- Faturalı Kesimler -->
      <div class="bg-card border border-border rounded-2xl p-4 shadow-sm space-y-3">
        <div class="flex justify-between items-center border-b border-border pb-2">
          <h3 class="text-xs font-bold text-accent flex items-center gap-2">
            <iconify-icon icon="lucide:receipt" class="text-accent"></iconify-icon>
            Faturalı Kesim (+%1 KDV)
          </h3>
          <span id="fat-count-label" class="text-[10px] font-semibold text-accent/80 bg-accent/10 px-2 py-0.5 rounded">0 Kayıt</span>
        </div>
        <div id="fat-list-container" class="space-y-2">
          <!-- Faturalı liste buraya gelecek -->
        </div>
      </div>
    </section>
  </main>

  <!-- ALT NAVİGASYON -->
  <nav class="fixed inset-x-0 bottom-0 z-20 border-t border-border bg-card px-2 pb-4 pt-2 shadow-lg">
    <div class="mx-auto flex max-w-md items-center justify-between">
      <a href="ana-sayfa.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:house" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Ana Sayfa</span>
      </a>
      <a href="kesim-listesi.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:clipboard-list" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Kesim Listesi</span>
      </a>
      <a href="stok.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:package" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Stok</span>
      </a>
      <a href="sevkiyat.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:truck" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Sevkiyat</span>
      </a>
      <a href="g-n-sonu.html" class="flex flex-col items-center gap-1 rounded-lg bg-primary px-3 py-1.5 text-primary-foreground">
        <iconify-icon icon="lucide:circle-check-big" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Gün Sonu</span>
      </a>
    </div>
  </nav>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const tumStoklar = JSON.parse(localStorage.getItem('stoklar')) || [];

      let hamTutar = 0;
      let kdvTutar = 0;
      let stopajTutar = 0;
      let netTutar = 0;

      let stdListHtml = '';
      let fatListHtml = '';
      let stdCount = 0;
      let fatCount = 0;

      tumStoklar.forEach(item => {
        const hMaliyet = parseFloat(item.hamMaliyet || (parseFloat(item.agirlik || 0) * parseFloat(item.birimFiyat || 0)));
        const nMaliyet = parseFloat(item.maliyet || 0);

        hamTutar += hMaliyet;
        netTutar += nMaliyet;

        const isFaturalı = item.kesimTipi && item.kesimTipi.includes('Faturalı');

        if (isFaturalı) {
          fatCount++;
          kdvTutar += (hMaliyet * 0.01);
          fatListHtml += `
            <div class="bg-muted/30 border border-border/70 rounded-xl p-3 flex justify-between items-center text-xs">
              <div>
                <span class="font-bold text-foreground">${item.musteri || 'Müşteri Belirtilmemiş'}</span>
                <span class="text-[10px] bg-secondary text-secondary-foreground px-1.5 py-0.5 rounded ml-1">${item.kupeNo || item.animalId} (${item.cins})</span>
              </div>
              <span class="font-extrabold text-foreground">${nMaliyet.toLocaleString('tr-TR', {minimumFractionDigits: 2})} TL</span>
            </div>
          `;
        } else {
          stdCount++;
          stopajTutar += (hMaliyet * 0.015);
          stdListHtml += `
            <div class="bg-muted/30 border border-border/70 rounded-xl p-3 flex justify-between items-center text-xs">
              <div>
                <span class="font-bold text-foreground">${item.musteri || 'Müşteri Belirtilmemiş'}</span>
                <span class="text-[10px] bg-secondary text-secondary-foreground px-1.5 py-0.5 rounded ml-1">${item.kupeNo || item.animalId} (${item.cins})</span>
              </div>
              <span class="font-extrabold text-foreground">${nMaliyet.toLocaleString('tr-TR', {minimumFractionDigits: 2})} TL</span>
            </div>
          `;
        }
      });

      document.getElementById('gs-ham-tutar').textContent = `${hamTutar.toLocaleString('tr-TR', {minimumFractionDigits: 2})} TL`;
      document.getElementById('gs-kdv-tutar').textContent = `+${kdvTutar.toLocaleString('tr-TR', {minimumFractionDigits: 2})} TL`;
      document.getElementById('gs-stopaj-tutar').textContent = `-${stopajTutar.toLocaleString('tr-TR', {minimumFractionDigits: 2})} TL`;
      document.getElementById('gs-net-tutar').textContent = `${netTutar.toLocaleString('tr-TR', {minimumFractionDigits: 2})} TL`;

      document.getElementById('std-count-label').textContent = `${stdCount} Kayıt`;
      document.getElementById('fat-count-label').textContent = `${fatCount} Kayıt`;

      document.getElementById('std-list-container').innerHTML = stdListHtml || `<p class="text-xs text-muted-foreground text-center py-2">Kayıt bulunamadı.</p>`;
      document.getElementById('fat-list-container').innerHTML = fatListHtml || `<p class="text-xs text-muted-foreground text-center py-2">Kayıt bulunamadı.</p>`;
    });
  </script>
</body>
</html>
