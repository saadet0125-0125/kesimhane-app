<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gün Sonu Raporu - Kesimhane</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-gray-800 border-b pb-3">Gün Sonu Raporu</h1>

        <!-- MÜŞTERİ LİSTESİ VE KESİM DETAYLARI TABLOSU -->
        <div class="overflow-x-auto mb-6">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-800 text-white">
                        <th class="p-3 border">Müşteri Adı</th>
                        <th class="p-3 border">Telefon</th>
                        <th class="p-3 border">IBAN</th>
                        <th class="p-3 border">Kesim Türü</th>
                        <th class="p-3 border text-right">Tutar</th>
                    </tr>
                </thead>
                <tbody id="raporTablosu" class="bg-white divide-y">
                    <!-- JavaScript burayı otomatik dolduracak -->
                </tbody>
            </table>
        </div>

        <!-- ÖDEME ÖZETİ (ÖDENECEK TUTARLAR) -->
        <div class="bg-gray-50 p-4 rounded-md border w-full md:w-1/2 ml-auto space-y-2">
            <div class="flex justify-between items-center text-gray-700">
                <span>Standart Kesim Ödemesi:</span>
                <span id="standartToplam" class="font-semibold text-lg">0,00 TL</span>
            </div>
            <div class="flex justify-between items-center text-gray-700">
                <span>Faturalı Kesim Ödemesi:</span>
                <span id="faturaliToplam" class="font-semibold text-lg">0,00 TL</span>
            </div>
            <hr class="my-2 border-gray-300">
            <div class="flex justify-between items-center text-xl font-bold text-gray-900">
                <span>Toplam Ödenecek Tutar:</span>
                <span id="genelToplam" class="text-green-600">0,00 TL</span>
            </div>
        </div>
    </div>

    <!-- OTOMATİK VERİ ÇEKME KODU -->
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        let gunSonuRaporu = JSON.parse(localStorage.getItem('gunSonuRaporu')) || [];

        let standartToplam = 0;
        let faturaliToplam = 0;

        const raporTablosu = document.getElementById("raporTablosu");
        
        if (gunSonuRaporu.length === 0) {
            raporTablosu.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">Henüz kayıtlı işlem bulunmuyor.</td></tr>`;
        } else {
            raporTablosu.innerHTML = gunSonuRaporu.map(item => {
                const tutar = parseFloat(item.tutar || 0);
                
                if (item.kesimTuru === 'faturali') {
                    faturaliToplam += tutar;
                } else {
                    standartToplam += tutar;
                }

                return `
                    <tr class="hover:bg-gray-50">
                        <td class="p-3 border">${item.musteriAdi || '-'}</td>
                        <td class="p-3 border">${item.telefon || '-'}</td>
                        <td class="p-3 border font-mono text-sm">${item.iban || '-'}</td>
                        <td class="p-3 border font-medium">${item.kesimTuru === 'faturali' ? 'Faturalı Kesim' : 'Standart Kesim'}</td>
                        <td class="p-3 border text-right font-bold">${tutar.toFixed(2)} TL</td>
                    </tr>
                `;
            }).join('');
        }

        const genelToplam = standartToplam + faturaliToplam;

        document.getElementById("standartToplam").innerText = standartToplam.toFixed(2) + " TL";
        document.getElementById("faturaliToplam").innerText = faturaliToplam.toFixed(2) + " TL";
        document.getElementById("genelToplam").innerText = genelToplam.toFixed(2) + " TL";
    });
    </script>
</body>
</html>
