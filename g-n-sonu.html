<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gün Sonu Raporu — Kesimhane</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          background: 'rgb(244 247 248 / <alpha-value>)',
          foreground: 'rgb(23 36 45 / <alpha-value>)',
          primary: { DEFAULT: 'rgb(18 48 71 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          secondary: { DEFAULT: 'rgb(221 235 233 / <alpha-value>)', foreground: 'rgb(18 63 61 / <alpha-value>)' },
          accent: { DEFAULT: 'rgb(184 106 0 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          card: { DEFAULT: 'rgb(255 255 255 / <alpha-value>)', foreground: 'rgb(23 36 45 / <alpha-value>)' },
          border: 'rgb(201 213 217 / <alpha-value>)',
          muted: { DEFAULT: 'rgb(232 238 240 / <alpha-value>)', foreground: 'rgb(83 99 109 / <alpha-value>)' },
          success: { DEFAULT: 'rgb(44 110 73 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          destructive: { DEFAULT: 'rgb(180 35 24 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' }
        },
        fontFamily: { body: ['Inter', 'system-ui'] },
        borderRadius: { DEFAULT: '14px' }
      }}
    };
  </script>
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
</head>
<body class="bg-background text-foreground min-h-screen font-body pb-28">

  <div class="max-w-5xl mx-auto p-4 sm:p-6">
    <div class="bg-card border border-border rounded-2xl p-6 shadow-sm">
      
      <!-- ÜST BAŞLIK, TARİH SEÇİCİ VE SIFIRLAMA BUTONU -->
      <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
        <div>
          <h1 class="text-2xl font-bold text-foreground">Gün Sonu Raporu</h1>
          <p class="text-xs text-muted-foreground mt-0.5">Günlük ödeme ve kesim hareketleri</p>
        </div>

        <div class="flex items-center gap-3">
          <div class="flex items-center gap-1.5 bg-muted/40 border border-border rounded-xl px-3 py-1.5">
            <iconify-icon icon="lucide:calendar" class="text-muted-foreground text-sm"></iconify-icon>
            <input type="date" id="filter-date" class="bg-transparent text-xs font-semibold focus:outline-none text-foreground">
          </div>
          
          <button id="reset-btn" class="flex items-center gap-1 bg-destructive text-destructive-foreground px-3 py-2 rounded-xl text-xs font-bold shadow hover:opacity-90">
            <iconify-icon icon="lucide:trash-2"></iconify-icon> Eski Verileri Sıfırla
          </button>
        </div>
      </div>

      <!-- SEKME GEÇİŞLERİ (BEKLEYEN VE ÖDENENLER) -->
      <div class="flex border-b border-border mb-4">
        <button id="tab-pending" class="px-4 py-2 text-xs font-bold border-b-2 border-primary text-primary transition-all">
          <iconify-icon icon="lucide:clock" class="inline mr-1"></iconify-icon> Bekleyen Ödemeler
        </button>
        <button id="tab-completed" class="px-4 py-2 text-xs font-bold border-b-2 border-transparent text-muted-foreground hover:text-foreground transition-all">
          <iconify-icon icon="lucide:check-circle-2" class="inline mr-1 text-success"></iconify-icon> Tamamlanan / Ödenenler (Arşiv)
        </button>
      </div>

      <!-- ÖDEMELER TABLOSU -->
      <div class="overflow-x-auto rounded-xl border border-border mb-6">
        <table class="w-full text-left text-xs">
          <thead class="bg-primary text-primary-foreground font-semibold">
            <tr>
              <th class="p-3">Müşteri Adı</th>
              <th class="p-3">Adres / İletişim</th>
              <th class="p-3">IBAN</th>
              <th class="p-3">Kesim Türü</th>
              <th class="p-3">Tutar</th>
              <th class="p-3 text-right" id="action-header">İşlem</th>
            </tr>
          </thead>
          <tbody id="report-table-body" class="divide-y divide-border bg-card">
            <!-- Dinamik veriler gelecek -->
          </tbody>
        </table>
      </div>

      <!-- ÖZET TOPLAMLAR KARTI -->
      <div class="flex justify-end">
        <div class="w-full sm:w-80 rounded-xl bg-secondary/30 border border-border p-4 space-y-2">
          <div class="flex justify-between items-center text-xs text-muted-foreground">
            <span>Standart Kesim Ödemesi:</span>
            <span id="stat-std-tutar" class="font-bold text-foreground">0.00 TL</span>
          </div>
          <div class="flex justify-between items-center text-xs text-muted-foreground">
            <span>Faturalı Kesim Ödemesi:</span>
            <span id="stat-fat-tutar" class="font-bold text-foreground">0.00 TL</span>
          </div>
          <div class="flex justify-between items-center text-sm font-bold pt-2 border-t border-border">
            <span id="label-toplam" class="text-foreground">Toplam Ödenecek Tutar:</span>
            <span id="stat-toplam-tutar" class="text-base font-extrabold text-success">0.00 TL</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- NAV MENÜ -->
  <nav class="fixed inset-x-0 bottom-0 z-20 border-t border-border bg-card px-2 pb-4 pt-2 shadow-lg">
    <div class="mx-auto flex max-w-md items-center justify-between">
      <a href="ana-sayfa.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:house" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Anasayfa</span>
      </a>
      <a href="kesim-listesi.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:clipboard-list" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Kesim Listesi</span>
      </a>
      <a href="stok.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:package" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Stok</span>
      </a>
      <a href="sevkiyat.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:truck" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Sevkiyat</span>
      </a>
      <a href="g-n-sonu.html" class="flex flex-col items-center gap-1 rounded-lg bg-primary px-3 py-1.5 text-primary-foreground">
        <iconify-icon icon="lucide:circle-check-big" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Gün Sonu</span>
      </a>
    </div>
  </nav>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const dateInput = document.getElementById('filter-date');
      const tabPending = document.getElementById('tab-pending');
      const tabCompleted = document.getElementById('tab-completed');
      
      let activeTab = 'pending'; // 'pending' veya 'completed'

      const now = new Date();
      dateInput.value = now.toISOString().split('T')[0];

      dateInput.addEventListener('change', raporuYukle);

      tabPending.addEventListener('click', () => {
        activeTab = 'pending';
        tabPending.className = "px-4 py-2 text-xs font-bold border-b-2 border-primary text-primary transition-all";
        tabCompleted.className = "px-4 py-2 text-xs font-bold border-b-2 border-transparent text-muted-foreground hover:text-foreground transition-all";
        document.getElementById('action-header').innerText = "İşlem";
        document.getElementById('label-toplam').innerText = "Toplam Ödenecek Tutar:";
        raporuYukle();
      });

      tabCompleted.addEventListener('click', () => {
        activeTab = 'completed';
        tabCompleted.className = "px-4 py-2 text-xs font-bold border-b-2 border-success text-success transition-all";
        tabPending.className = "px-4 py-2 text-xs font-bold border-b-2 border-transparent text-muted-foreground hover:text-foreground transition-all";
        document.getElementById('action-header').innerText = "Ödeme Durumu";
        document.getElementById('label-toplam').innerText = "Toplam Ödenen Tutar:";
        raporuYukle();
      });

      // TEK SEÇİM ÖDENDİ YAPMA (ARŞİVE AKTARMA)
      window.odendiYap = function(id) {
        if (confirm('Bu kaydın ödemesi yapıldı olarak arşivlensin mi?')) {
          let gunlukKesimler = JSON.parse(localStorage.getItem('gunlukKesimler')) || [];
          let odenenKesimler = JSON.parse(localStorage.getItem('odenenKesimler')) || [];

          const index = gunlukKesimler.findIndex(item => item.id === id);
          if (index !== -1) {
            const odendiItem = gunlukKesimler.splice(index, 1)[0];
            odendiItem.odemeTarihi = new Date().toLocaleDateString('tr-TR');
            odenenKesimler.push(odendiItem);

            localStorage.setItem('gunlukKesimler', JSON.stringify(gunlukKesimler));
            localStorage.setItem('odenenKesimler', JSON.stringify(odenenKesimler));
            raporuYukle();
          }
        }
      };

      // TÜMÜNÜ SIFIRLAMA
      document.getElementById('reset-btn').addEventListener('click', function() {
        if (confirm('Tüm gün sonu ve arşivlenmiş ödeme verilerini sıfırlamak istediğinize emin misiniz?')) {
          localStorage.removeItem('gunlukKesimler');
          localStorage.removeItem('odenenKesimler');
          raporuYukle();
        }
      });

      function raporuYukle() {
        const selectedDate = dateInput.value; 
        const targetKey = activeTab === 'pending' ? 'gunlukKesimler' : 'odenenKesimler';
        const kesimler = JSON.parse(localStorage.getItem(targetKey)) || [];
        const tbody = document.getElementById('report-table-body');

        const filtrelenmis = kesimler.filter(item => {
          const checkDate = activeTab === 'pending' ? item.tarih : (item.odemeTarihi || item.tarih);
          if(!checkDate) return true;
          const parts = checkDate.split('.');
          if(parts.length === 3) {
            const itemIsoDate = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
            return itemIsoDate === selectedDate;
          }
          return true;
        });

        let stdTutar = 0;
        let fatTutar = 0;

        if (filtrelenmis.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" class="p-8 text-center text-muted-foreground">
                ${activeTab === 'pending' ? 'Bekleyen ödeme kaydı bulunmuyor.' : 'Seçilen tarihte ödenmiş kayıt bulunmuyor.'}
              </td>
            </tr>
          `;
        } else {
          tbody.innerHTML = filtrelenmis.map(item => {
            const maliyetVal = parseFloat(item.maliyet || 0);
            if (item.tip === 'Faturalı') fatTutar += maliyetVal;
            else stdTutar += maliyetVal;

            return `
              <tr class="hover:bg-muted/10 transition-colors">
                <td class="p-3 font-bold text-foreground">${item.musteri}</td>
                <td class="p-3 text-muted-foreground">${item.adres || '---'}</td>
                <td class="p-3 font-mono text-[11px]">${item.iban || '---'}</td>
                <td class="p-3">
                  <span class="px-2 py-0.5 rounded text-[10px] font-bold ${item.tip === 'Faturalı' ? 'bg-accent/15 text-accent' : 'bg-secondary text-secondary-foreground'}">
                    ${item.tip} Kesim
                  </span>
                </td>
                <td class="p-3 font-bold text-success">${maliyetVal.toLocaleString('tr-TR', {minimumFractionDigits:2})} TL</td>
                <td class="p-3 text-right">
                  ${activeTab === 'pending' ? `
                    <button onclick="odendiYap(${item.id})" class="bg-success text-success-foreground px-2.5 py-1 rounded-lg text-[10px] font-bold shadow hover:opacity-90">
                      <iconify-icon icon="lucide:check" class="inline text-xs mr-0.5"></iconify-icon> Ödendi Yap
                    </button>
                  ` : `
                    <span class="inline-flex items-center gap-1 text-xs font-bold text-success bg-success/10 px-2 py-1 rounded-lg">
                      <iconify-icon icon="lucide:check-check"></iconify-icon> Ödendi
                    </span>
                  `}
                </td>
              </tr>
            `;
          }).join('');
        }

        document.getElementById('stat-std-tutar').textContent = `${stdTutar.toLocaleString('tr-TR', {minimumFractionDigits: 2})} TL`;
        document.getElementById('stat-fat-tutar').textContent = `${fatTutar.toLocaleString('tr-TR', {minimumFractionDigits: 2})} TL`;
        
        const toplam = stdTutar + fatTutar;
        document.getElementById('stat-toplam-tutar').textContent = `${toplam.toLocaleString('tr-TR', {minimumFractionDigits: 2})} TL`;
      }

      raporuYukle();
    });
  </script>
</body>
</html>
