<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sevkiyat Yönetimi — Kesimhane</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          background: 'rgb(244 247 248 / <alpha-value>)',
          foreground: 'rgb(23 36 45 / <alpha-value>)',
          primary: { DEFAULT: 'rgb(18 48 71 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          secondary: { DEFAULT: 'rgb(221 235 233 / <alpha-value>)', foreground: 'rgb(18 63 61 / <alpha-value>)' },
          accent: { DEFAULT: 'rgb(184 106 0 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          card: { DEFAULT: 'rgb(255 255 255 / <alpha-value>)', foreground: 'rgb(23 36 45 / <alpha-value>)' },
          border: 'rgb(201 213 217 / <alpha-value>)',
          muted: { DEFAULT: 'rgb(232 238 240 / <alpha-value>)', foreground: 'rgb(83 99 109 / <alpha-value>)' },
          success: { DEFAULT: 'rgb(44 110 73 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          destructive: { DEFAULT: 'rgb(180 35 24 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' }
        },
        fontFamily: { body: ['Inter', 'system-ui'] },
        borderRadius: { DEFAULT: '14px' }
      }}
    };
  </script>
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
</head>
<body class="bg-background text-foreground min-h-screen font-body pb-32">

  <header class="px-5 pb-4 pt-8 flex justify-between items-center">
    <div>
      <p class="text-xs font-semibold text-muted-foreground">Lojistik & Dağıtım</p>
      <h1 class="text-2xl font-bold text-foreground">Sevkiyat Yönetimi</h1>
    </div>
    <div class="flex items-center gap-2">
      <button id="yeni-sevkiyat-baslat-btn" class="bg-primary text-primary-foreground px-3.5 py-2 rounded-xl text-xs font-bold shadow hover:opacity-95 flex items-center gap-1.5">
        <iconify-icon icon="lucide:plus" class="text-base"></iconify-icon> Yeni Sevkiyat Başlat
      </button>
    </div>
  </header>

  <main class="px-5 space-y-4">
    <!-- AKTİF SEVKİYAT / BEKLEYEN SEÇİMLER ALANI -->
    <div id="aktif-sevkiyat-bolumu" class="bg-card border border-border rounded-2xl p-4 shadow-sm space-y-4 hidden">
      <div class="flex justify-between items-center border-b border-border pb-3">
        <h2 class="text-sm font-bold text-foreground flex items-center gap-1.5">
          <iconify-icon icon="lucide:truck" class="text-primary text-base"></iconify-icon> Yeni Sevkiyat Oluşturma & Sevk Detayları
        </h2>
        <button id="iptal-sevkiyat-btn" class="text-xs text-red-500 font-bold hover:underline">İptal Et</button>
      </div>

      <!-- Sevkiyat Bilgileri Formu -->
      <form id="sevkiyat-form" class="space-y-3">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-bold text-muted-foreground mb-1">Gideceği Tesis Adı</label>
            <input type="text" id="tesis-adi" required placeholder="Örn: Ankara Entegre Kesimhane" class="w-full bg-background border border-border px-3 py-2 rounded-xl text-xs outline-none font-semibold">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-muted-foreground mb-1">Tesis Adresi / Şehir</label>
            <input type="text" id="tesis-adres" required placeholder="Örn: Sincan / Ankara" class="w-full bg-background border border-border px-3 py-2 rounded-xl text-xs outline-none font-semibold">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-[11px] font-bold text-muted-foreground mb-1">Şoför Ad Soyad</label>
            <input type="text" id="sofor-adi" required placeholder="Ad Soyad" class="w-full bg-background border border-border px-3 py-2 rounded-xl text-xs outline-none font-semibold">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-muted-foreground mb-1">Şoför Telefon</label>
            <input type="text" id="sofor-telefon" placeholder="05XX XXX XX XX" class="w-full bg-background border border-border px-3 py-2 rounded-xl text-xs outline-none font-semibold">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-muted-foreground mb-1">Şoför TC Kimlik No</label>
            <input type="text" id="sofor-tc" maxlength="11" placeholder="TC Kimlik No" class="w-full bg-background border border-border px-3 py-2 rounded-xl text-xs outline-none font-semibold">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-bold text-muted-foreground mb-1">Araç Plaka</label>
            <input type="text" id="arac-plaka" required placeholder="20 ABC 34" class="w-full bg-background border border-border px-3 py-2 rounded-xl text-xs outline-none font-semibold">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-muted-foreground mb-1">Dorse Plaka</label>
            <input type="text" id="dorse-plaka" placeholder="20 XYZ 34 (Varsa)" class="w-full bg-background border border-border px-3 py-2 rounded-xl text-xs outline-none font-semibold">
          </div>
        </div>

        <!-- Seçilen Hayvanlar Listesi -->
        <div class="pt-2">
          <label class="block text-xs font-bold text-foreground mb-2">Sevkiyata Eklenecek Hayvanlar (<span id="secilen-adet-lbl">0</span> Adet)</label>
          <div id="secilen-hayvanlar-listesi" class="space-y-2 max-h-48 overflow-y-auto pr-1">
            <!-- Dinamik Eklenecek -->
          </div>
        </div>

        <button type="submit" class="w-full bg-success text-success-foreground font-bold py-2.5 rounded-xl shadow hover:opacity-95 transition-all text-xs mt-2 flex items-center justify-center gap-1.5">
          <iconify-icon icon="lucide:truck" class="text-base"></iconify-icon> Sevk İşlemini Tamamla ve Stoktan Düş
        </button>
      </form>
    </div>

    <!-- GEÇMİŞ SEVKİYATLAR LİSTESİ -->
    <section class="space-y-3">
      <h2 class="text-sm font-bold text-foreground px-1">Geçmiş Sevkiyatlar</h2>
      <div id="gecmis-sevkiyatlar-container" class="space-y-3">
        <!-- Geçmiş Sevkiyatlar Buraya Gelecek -->
      </div>
    </section>
  </main>

  <!-- STOKTAN HAYVAN SEÇME MODALI (Yeni Sevkiyat Başlatıldığında) -->
  <div id="stok-secim-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-card w-full max-w-lg rounded-2xl border border-border shadow-2xl p-6 space-y-4 my-auto max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-border pb-3">
        <h3 class="font-bold text-sm text-foreground flex items-center gap-2">
          <iconify-icon icon="lucide:package" class="text-primary text-lg"></iconify-icon> Stoktan Hayvan Seç
        </h3>
        <button id="modal-kapat-btn" class="text-muted-foreground hover:text-foreground text-lg">
          <iconify-icon icon="lucide:x"></iconify-icon>
        </button>
      </div>

      <div class="space-y-2 max-h-60 overflow-y-auto" id="modal-stok-listesi">
        <!-- Stoktaki Hayvanlar Checkbox Listesi -->
      </div>

      <button type="button" id="secilenleri-aktar-btn" class="w-full bg-primary text-primary-foreground font-bold py-2.5 rounded-xl shadow hover:opacity-95 text-xs">
        Seçilenleri Sevkiyata Ekle
      </button>
    </div>
  </div>

  <!-- ALT NAVİGASYON -->
  <nav class="fixed inset-x-0 bottom-0 z-20 border-t border-border bg-card px-2 pb-4 pt-2 shadow-lg">
    <div class="mx-auto flex max-w-md items-center justify-between">
      <a href="ana-sayfa.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:house" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Ana Sayfa</span>
      </a>
      <a href="kesim-listesi.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:clipboard-list" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Kesim Listesi</span>
      </a>
      <a href="stok.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:package" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Stok</span>
      </a>
      <a href="sevkiyat.html" class="flex flex-col items-center gap-1 rounded-lg bg-primary px-3 py-1.5 text-primary-foreground">
        <iconify-icon icon="lucide:truck" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Sevkiyat</span>
      </a>
      <a href="g-n-sonu.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:circle-check-big" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Gün Sonu</span>
      </a>
    </div>
  </nav>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const aktifBolum = document.getElementById('aktif-sevkiyat-bolumu');
      const yeniSevkiyatBtn = document.getElementById('yeni-sevkiyat-baslat-btn');
      const iptalBtn = document.getElementById('iptal-sevkiyat-btn');
      const sevkiyatForm = document.getElementById('sevkiyat-form');
      const secilenHayvanlarListesi = document.getElementById('secilen-hayvanlar-listesi');
      const secilenAdetLbl = document.getElementById('secilen-adet-lbl');
      const gecmisContainer = document.getElementById('gecmis-sevkiyatlar-container');

      const stokSecimModal = document.getElementById('stok-secim-modal');
      const modalKapatBtn = document.getElementById('modal-kapat-btn');
      const modalStokListesi = document.getElementById('modal-stok-listesi');
      const secilenleriAktarBtn = document.getElementById('secilenleri-aktar-btn');

      let secilenHayvanIndexleri = [];

      // Sayfa Açıldığında Kontrol Et (Stoktan "Seçilenleri Sevk Et" ile mi gelindi?)
      const taslakIds = JSON.parse(localStorage.getItem('taslakSevkiyatIds'));
      if (taslakIds && taslakIds.length > 0) {
        secilenHayvanIndexleri = taslakIds.map(id => Number(id));
        localStorage.removeItem('taslakSevkiyatIds');
        sevkiyatFormuAc();
      }

      yeniSevkiyatBtn.addEventListener('click', function () {
        stokModaliniAc();
      });

      modalKapatBtn.addEventListener('click', () => stokSecimModal.classList.add('hidden'));
      iptalBtn.addEventListener('click', () => {
        aktifBolum.classList.add('hidden');
        secilenHayvanIndexleri = [];
      });

      function stokModaliniAc() {
        const tumStoklar = JSON.parse(localStorage.getItem('stoklar')) || [];
        const stoktakiler = tumStoklar.map((item, idx) => ({ ...item, orijinalIndex: idx })).filter(s => !s.durum || s.durum === 'stokta');

        if (stoktakiler.length === 0) {
          alert('Stokta sevk edilecek hayvan bulunmuyor!');
          return;
        }

        modalStokListesi.innerHTML = stoktakiler.map(item => `
          <label class="flex items-center justify-between p-2.5 border border-border rounded-xl bg-background hover:bg-muted/30 cursor-pointer text-xs">
            <div class="flex items-center gap-2">
              <input type="checkbox" value="${item.orijinalIndex}" class="modal-cb w-4 h-4 rounded border-border text-primary focus:ring-primary">
              <div>
                <strong>${item.cinsi || 'Hayvan'} - ${item.kupeNo || 'Kodsuz'}</strong>
                <p class="text-[10px] text-muted-foreground">Müşteri: ${item.musteriAdi || item.musteri || '-'}</p>
              </div>
            </div>
            <span class="font-bold text-foreground">${item.agirlik || 0} kg</span>
          </label>
        `).join('');

        stokSecimModal.classList.remove('hidden');
      }

      secilenleriAktarBtn.addEventListener('click', function () {
        const checkedBoxes = modalStokListesi.querySelectorAll('.modal-cb:checked');
        secilenHayvanIndexleri = Array.from(checkedBoxes).map(cb => Number(cb.value));

        if (secilenHayvanIndexleri.length === 0) {
          alert('Lütfen en az bir hayvan seçin!');
          return;
        }

        stokSecimModal.classList.add('hidden');
        sevkiyatFormuAc();
      });

      function sevkiyatFormuAc() {
        aktifBolum.classList.remove('hidden');
        const tumStoklar = JSON.parse(localStorage.getItem('stoklar')) || [];
        
        secilenAdetLbl.textContent = secilenHayvanIndexleri.length;
        secilenHayvanlarListesi.innerHTML = secilenHayvanIndexleri.map(idx => {
          const item = tumStoklar[idx];
          if (!item) return '';
          return `
            <div class="flex justify-between items-center bg-background border border-border p-2 rounded-xl text-xs">
              <div>
                <strong class="text-primary">${item.cinsi || 'Hayvan'} (${item.kupeNo || 'Kodsuz'})</strong>
                <p class="text-[10px] text-muted-foreground">Müşteri: ${item.musteriAdi || item.musteri || '-'}</p>
              </div>
              <span class="font-bold text-foreground">${item.agirlik || 0} kg</span>
            </div>
          `;
        }).join('');
      }

      // Sevkiyatı Tamamla ve Stoktan Düş
      sevkiyatForm.addEventListener('submit', function (e) {
        e.preventDefault();

        const tesisAdi = document.getElementById('tesis-adi').value.trim();
        const tesisAdres = document.getElementById('tesis-adres').value.trim();
        const soforAdi = document.getElementById('sofor-adi').value.trim();
        const soforTelefon = document.getElementById('sofor-telefon').value.trim();
        const soforTc = document.getElementById('sofor-tc').value.trim();
        const aracPlaka = document.getElementById('arac-plaka').value.trim();
        const dorsePlaka = document.getElementById('dorse-plaka').value.trim();
        const sevkTarihi = new Date().toISOString().split('T')[0];

        let tumStoklar = JSON.parse(localStorage.getItem('stoklar')) || [];
        let sevkEdilenHayvanlar = [];

        secilenHayvanIndexleri.forEach(idx => {
          if (tumStoklar[idx]) {
            tumStoklar[idx].durum = 'sevk_edildi'; // Stoktan düşüldü işareti
            sevkEdilenHayvanlar.push(tumStoklar[idx]);
          }
        });

        localStorage.setItem('stoklar', JSON.stringify(tumStoklar));

        const yeniSevkiyatKaydi = {
          id: Date.now(),
          tesisAdi,
          tesisAdres,
          soforAdi,
          soforTelefon,
          soforTc,
          aracPlaka,
          dorsePlaka,
          sevkTarihi,
          hayvanlar: sevkEdilenHayvanlar
        };

        let sevkiyatlar = JSON.parse(localStorage.getItem('sevkiyatlar')) || [];
        sevkiyatlar.push(yeniSevkiyatKaydi);
        localStorage.setItem('sevkiyatlar', JSON.stringify(sevkiyatlar));

        alert('Sevkiyat başarıyla gerçekleştirildi ve seçilen hayvanlar stoktan düşüldü!');
        sevkiyatForm.reset();
        aktifBolum.classList.add('hidden');
        secilenHayvanIndexleri = [];
        gecmisSevkiyatlarıGoster();
      });

      function gecmisSevkiyatlarıGoster() {
        const sevkiyatlar = JSON.parse(localStorage.getItem('sevkiyatlar')) || [];
        if (sevkiyatlar.length === 0) {
          gecmisContainer.innerHTML = `<div class="bg-card border border-border rounded-2xl p-6 text-center text-xs text-muted-foreground font-semibold">Henüz gerçekleştirilen sevkiyat bulunmuyor.</div>`;
          return;
        }

        gecmisContainer.innerHTML = sevkiyatlar.slice().reverse().map(s => {
          const toplamKg = s.hayvanlar ? s.hayvanlar.reduce((acc, h) => acc + (parseFloat(h.agirlik) || 0), 0) : 0;
          return `
            <div class="bg-card border border-border p-4 rounded-2xl shadow-sm space-y-2">
              <div class="flex justify-between items-start">
                <div>
                  <span class="text-xs font-bold bg-primary/10 text-primary px-2.5 py-0.5 rounded-lg">Tesis: ${s.tesisAdi} (${s.tesisAdres})</span>
                  <h3 class="font-bold text-sm text-foreground mt-1.5">Şoför: ${s.soforAdi} (${s.aracPlaka})</h3>
                  <p class="text-[11px] text-muted-foreground mt-0.5">Telefon: ${s.soforTelefon || '-'} | TC: ${s.soforTc || '-'}</p>
                </div>
                <div class="text-right">
                  <span class="font-extrabold text-success text-sm">${s.hayvanlar ? s.hayvanlar.length : 0} Hayvan</span>
                  <span class="block text-xs font-bold text-foreground">${toplamKg} kg</span>
                </div>
              </div>
              <div class="flex justify-between items-center pt-2 border-t border-border/60 text-[11px] text-muted-foreground font-semibold">
                <span>Dorse: ${s.dorsePlaka || 'Yok'}</span>
                <span>Sevk Tarihi: ${s.sevkTarihi}</span>
              </div>
            </div>
          `;
        }).join('');
      }

      gecmisSevkiyatlarıGoster();
    });
  </script>
</body>
</html>
