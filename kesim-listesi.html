<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kesim Listesi — Kesimhane</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          background: 'rgb(244 247 248 / <alpha-value>)',
          foreground: 'rgb(23 36 45 / <alpha-value>)',
          primary: { DEFAULT: 'rgb(18 48 71 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          secondary: { DEFAULT: 'rgb(221 235 233 / <alpha-value>)', foreground: 'rgb(18 63 61 / <alpha-value>)' },
          accent: { DEFAULT: 'rgb(184 106 0 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          card: { DEFAULT: 'rgb(255 255 255 / <alpha-value>)', foreground: 'rgb(23 36 45 / <alpha-value>)' },
          border: 'rgb(201 213 217 / <alpha-value>)',
          muted: { DEFAULT: 'rgb(232 238 240 / <alpha-value>)', foreground: 'rgb(83 99 109 / <alpha-value>)' },
          success: { DEFAULT: 'rgb(44 110 73 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          destructive: { DEFAULT: 'rgb(180 40 40 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' }
        },
        fontFamily: { body: ['Inter', 'system-ui'] },
        borderRadius: { DEFAULT: '14px' }
      }}
    };
  </script>
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
</head>
<body class="bg-background text-foreground min-h-screen font-body pb-28">

  <!-- ANA İÇERİK (Giriş kontrolü ana sayfada yapıldığı için doğrudan görünür) -->
  <div id="main-content">
    <header class="px-5 pb-4 pt-8 flex justify-between items-center">
      <div>
        <p class="text-xs font-semibold text-muted-foreground">Operasyon Yönetimi</p>
        <h1 class="text-2xl font-bold text-foreground">Kesim Listesi</h1>
      </div>
      <div class="flex items-center gap-2">
        <button id="yeni-kesim-btn" class="bg-primary text-primary-foreground px-3.5 py-2 rounded-xl text-xs font-bold shadow hover:opacity-95 flex items-center gap-1.5">
          <iconify-icon icon="lucide:plus" class="text-base"></iconify-icon> Yeni Kesim Kaydı
        </button>
        <a href="ana-sayfa.html" id="cikis-link" class="text-xs font-bold bg-destructive/15 text-red-600 px-3 py-2 rounded-xl hover:bg-red-600 hover:text-white transition-all flex items-center">
          Çıkış
        </a>
      </div>
    </header>

    <main class="px-5 space-y-3" id="kesim-listesi-container">
      <!-- Kesim Kartları Dinamik Olarak Buraya Gelecek -->
    </main>
  </div>

  <!-- YENİ DETAYLI KESİM KAYDI MODALI (Pencere Yapısı Korundu) -->
  <div id="modal-overlay" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-card w-full max-w-xl rounded-2xl border border-border shadow-2xl p-6 space-y-4 my-auto max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-border pb-3">
        <div class="flex items-center gap-2 text-foreground font-bold text-sm">
          <iconify-icon icon="lucide:file-text" class="text-primary text-lg"></iconify-icon> Yeni Detaylı Kesim Kaydı
        </div>
        <button id="modal-kapat" class="text-muted-foreground hover:text-foreground text-lg">
          <iconify-icon icon="lucide:x"></iconify-icon>
        </button>
      </div>

      <form id="kesim-form" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-bold text-muted-foreground mb-1">Müşteri Adı</label>
            <input type="text" id="musteri-adi" required placeholder="Ad Soyad" class="w-full bg-background border border-border px-3 py-2 rounded-xl text-xs outline-none font-semibold">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-muted-foreground mb-1">Telefon</label>
            <input type="text" id="telefon" placeholder="05XX XXX XX XX" class="w-full bg-background border border-border px-3 py-2 rounded-xl text-xs outline-none font-semibold">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-bold text-muted-foreground mb-1">IBAN Numarası</label>
            <input type="text" id="iban" placeholder="TR..." class="w-full bg-background border border-border px-3 py-2 rounded-xl text-xs outline-none font-semibold">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-muted-foreground mb-1">Kısa Adres / Şehir</label>
            <input type="text" id="adres" placeholder="DENİZLİ" class="w-full bg-background border border-border px-3 py-2 rounded-xl text-xs outline-none font-semibold">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-bold text-muted-foreground mb-1">Kesim Tipi</label>
            <select id="kesim-tipi" class="w-full bg-background border border-border px-3 py-2 rounded-xl text-xs outline-none font-semibold">
              <option value="Standart Kesim">Standart Kesim</option>
              <option value="Faturalı Kesim (+%1 KDV)">Faturalı Kesim (+%1 KDV)</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-muted-foreground mb-1">Kesen Personel / Kasap</label>
            <input type="text" id="kesen-personel" required placeholder="Örn: Ahmet Usta" class="w-full bg-background border border-border px-3 py-2 rounded-xl text-xs outline-none font-semibold">
          </div>
        </div>

        <!-- Hayvanlar Listesi Alanı -->
        <div class="space-y-3 pt-2">
          <div class="flex justify-between items-center">
            <label class="text-xs font-bold text-foreground">Kesilen Hayvanlar</label>
            <button type="button" id="hayvan-ekle-btn" class="bg-success/10 text-success px-2.5 py-1 rounded-lg text-xs font-bold hover:bg-success hover:text-white transition-all flex items-center gap-1">
              <iconify-icon icon="lucide:plus"></iconify-icon> Hayvan Ekle
            </button>
          </div>

          <div id="hayvanlar-container" class="space-y-3">
            <!-- Hayvan Satırı Örneği -->
            <div class="hayvan-satir bg-background border border-border p-3 rounded-xl space-y-2 relative">
              <div class="flex justify-between items-center text-xs font-bold text-muted-foreground">
                <span class="hayvan-baslik">Hayvan #1</span>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-[10px] text-muted-foreground mb-0.5">Cinsi</label>
                  <select class="h-cinsi w-full bg-card border border-border px-2 py-1.5 rounded-lg text-xs font-semibold outline-none">
                    <option value="İnek">İnek</option>
                    <option value="Dana">Dana</option>
                    <option value="Düve">Düve</option>
                    <option value="Koyun">Koyun</option>
                    <option value="Kuzu">Kuzu</option>
                  </select>
                </div>
                <div>
                  <label class="block text-[10px] text-muted-foreground mb-0.5">Kod / Küpe No</label>
                  <input type="text" class="h-kupe w-full bg-card border border-border px-2 py-1.5 rounded-lg text-xs font-semibold outline-none" placeholder="Örn: TR-123">
                </div>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-[10px] text-muted-foreground mb-0.5">Ağırlık (Kg)</label>
                  <input type="number" class="h-agirlik w-full bg-card border border-border px-2 py-1.5 rounded-lg text-xs font-semibold outline-none" value="400">
                </div>
                <div>
                  <label class="block text-[10px] text-muted-foreground mb-0.5">Birim Fiyat (TL/Kg)</label>
                  <input type="number" class="h-fiyat w-full bg-card border border-border px-2 py-1.5 rounded-lg text-xs font-semibold outline-none" value="280">
                </div>
              </div>
            </div>
          </div>
        </div>

        <button type="submit" class="w-full bg-primary text-primary-foreground font-bold py-2.5 rounded-xl shadow hover:opacity-95 transition-all text-xs mt-3 flex items-center justify-center gap-1.5">
          <iconify-icon icon="lucide:check" class="text-base"></iconify-icon> Kaydet ve Stoğa Aktar
        </button>
      </form>
    </div>
  </div>

  <!-- ALT NAVİGASYON -->
  <nav class="fixed inset-x-0 bottom-0 z-20 border-t border-border bg-card px-2 pb-4 pt-2 shadow-lg">
    <div class="mx-auto flex max-w-md items-center justify-between">
      <a href="ana-sayfa.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:house" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Ana Sayfa</span>
      </a>
      <a href="kesim-listesi.html" class="flex flex-col items-center gap-1 rounded-lg bg-primary px-3 py-1.5 text-primary-foreground">
        <iconify-icon icon="lucide:clipboard-list" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Kesim Listesi</span>
      </a>
      <a href="stok.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:package" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Stok</span>
      </a>
      <a href="sevkiyat.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:truck" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Sevkiyat</span>
      </a>
      <a href="g-n-sonu.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:circle-check-big" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Gün Sonu</span>
      </a>
    </div>
  </nav>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const modalOverlay = document.getElementById('modal-overlay');
      const yeniKesimBtn = document.getElementById('yeni-kesim-btn');
      const modalKapat = document.getElementById('modal-kapat');
      const kesimForm = document.getElementById('kesim-form');
      const hayvanEkleBtn = document.getElementById('hayvan-ekle-btn');
      const hayvanlarContainer = document.getElementById('hayvanlar-container');
      const kesimListesiContainer = document.getElementById('kesim-listesi-container');
      const cikisLink = document.getElementById('cikis-link');

      // Çıkış yapıldığında oturumu temizle ve ana sayfaya yönlendir
      cikisLink.addEventListener('click', function () {
        sessionStorage.removeItem('girisYapildi');
      });

      // Sayfa açıldığında doğrudan listeyi göster
      kesimListesiniGoster();

      // Modal Aç / Kapat
      yeniKesimBtn.addEventListener('click', () => modalOverlay.classList.remove('hidden'));
      modalKapat.addEventListener('click', () => modalOverlay.classList.add('hidden'));

      // Yeni Hayvan Satırı Ekleme
      hayvanEkleBtn.addEventListener('click', () => {
        const sayi = hayvanlarContainer.querySelectorAll('.hayvan-satir').length + 1;
        const div = document.createElement('div');
        div.className = 'hayvan-satir bg-background border border-border p-3 rounded-xl space-y-2 relative';
        div.innerHTML = `
          <div class="flex justify-between items-center text-xs font-bold text-muted-foreground">
            <span class="hayvan-baslik">Hayvan #${sayi}</span>
            <button type="button" class="satir-sil text-red-500 hover:text-red-700 text-xs">Sil</button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] text-muted-foreground mb-0.5">Cinsi</label>
              <select class="h-cinsi w-full bg-card border border-border px-2 py-1.5 rounded-lg text-xs font-semibold outline-none">
                <option value="İnek">İnek</option>
                <option value="Dana">Dana</option>
                <option value="Düve">Düve</option>
                <option value="Koyun">Koyun</option>
                <option value="Kuzu">Kuzu</option>
              </select>
            </div>
            <div>
              <label class="block text-[10px] text-muted-foreground mb-0.5">Kod / Küpe No</label>
              <input type="text" class="h-kupe w-full bg-card border border-border px-2 py-1.5 rounded-lg text-xs font-semibold outline-none" placeholder="Örn: TR-123">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] text-muted-foreground mb-0.5">Ağırlık (Kg)</label>
              <input type="number" class="h-agirlik w-full bg-card border border-border px-2 py-1.5 rounded-lg text-xs font-semibold outline-none" value="400">
            </div>
            <div>
              <label class="block text-[10px] text-muted-foreground mb-0.5">Birim Fiyat (TL/Kg)</label>
              <input type="number" class="h-fiyat w-full bg-card border border-border px-2 py-1.5 rounded-lg text-xs font-semibold outline-none" value="280">
            </div>
          </div>
        `;
        div.querySelector('.satir-sil').addEventListener('click', () => div.remove());
        hayvanlarContainer.appendChild(div);
      });

      // Kesim Kaydetme ve Stoğa/Ana Sayfaya Aktarma
      kesimForm.addEventListener('submit', function (e) {
        e.preventDefault();

        const musteriAdi = document.getElementById('musteri-adi').value.trim();
        const telefon = document.getElementById('telefon').value.trim();
        const iban = document.getElementById('iban').value.trim();
        const adres = document.getElementById('adres').value.trim();
        const kesimTipi = document.getElementById('kesim-tipi').value;
        const kesenPersonel = document.getElementById('kesen-personel').value.trim();
        const tarihStr = new Date().toISOString().split('T')[0];

        const satirlar = hayvanlarContainer.querySelectorAll('.hayvan-satir');
        let hayvanlarDizisi = [];
        let toplamKayitTutari = 0;

        satirlar.forEach(s => {
          const cinsi = s.querySelector('.h-cinsi').value;
          const kupeNo = s.querySelector('.h-kupe').value.trim();
          const agirlik = parseFloat(s.querySelector('.h-agirlik').value) || 0;
          const fiyat = parseFloat(s.querySelector('.h-fiyat').value) || 0;
          const hayvanTutari = agirlik * fiyat;

          toplamKayitTutari += hayvanTutari;

          hayvanlarDizisi.push({
            cinsi,
            kupeNo,
            agirlik,
            fiyat,
            tutar: hayvanTutari
          });
        });

        const yeniKayit = {
          musteriAdi,
          telefon,
          iban,
          adres,
          kesimTipi,
          kesenPersonel,
          kayitTarihi: tarihStr,
          hayvanlar: hayvanlarDizisi,
          toplamTutar: toplamKayitTutari
        };

        let kesimKayitlari = JSON.parse(localStorage.getItem('kesimKayitlari')) || [];
        kesimKayitlari.push(yeniKayit);
        localStorage.setItem('kesimKayitlari', JSON.stringify(kesimKayitlari));

        let stoklar = JSON.parse(localStorage.getItem('stoklar')) || [];
        hayvanlarDizisi.forEach(h => {
          stoklar.push({
            cinsi: h.cinsi,
            kupeNo: h.kupeNo,
            agirlik: h.agirlik,
            maliyet: h.tutar,
            kesimTipi: kesimTipi,
            tarih: tarihStr,
            kesenPersonel: kesenPersonel
          });
        });
        localStorage.setItem('stoklar', JSON.stringify(stoklar));

        modalOverlay.classList.add('hidden');
        kesimForm.reset();
        kesimListesiniGoster();
        alert('Kesim başarıyla kaydedildi!');
      });

      // Listeyi Ekrana Basan Fonksiyon
      function kesimListesiniGoster() {
        const kayitlar = JSON.parse(localStorage.getItem('kesimKayitlari')) || [];
        let html = '';

        if (kayitlar.length === 0) {
          kesimListesiContainer.innerHTML = `<div class="text-center py-8 text-xs text-muted-foreground font-semibold">Henüz kesim kaydı bulunmuyor.</div>`;
          return;
        }

        kayitlar.forEach((kayit, index) => {
          let hayvanlarHtml = '';
          if (kayit.hayvanlar && Array.isArray(kayit.hayvanlar)) {
            kayit.hayvanlar.forEach((h, hIdx) => {
              hayvanlarHtml += `
                <div class="bg-muted/40 border border-border/60 p-2.5 rounded-xl space-y-1 my-1">
                  <div class="flex justify-between items-center text-xs font-bold text-foreground">
                    <span>#${hIdx + 1} - ${h.cinsi} (${h.kupeNo || 'Küpe Yok'} - ${h.agirlik || 0} kg)</span>
                    <span class="text-primary font-extrabold">${Number(h.tutar || 0).toLocaleString('tr-TR', {minimumFractionDigits: 2})} TL</span>
                  </div>
                  <div class="text-[11px] text-muted-foreground flex justify-between">
                    <span>Kesen: ${kayit.kesenPersonel || 'Belirtilmemiş'}</span>
                    <span>Tarih: ${kayit.kayitTarihi || '-'}</span>
                  </div>
                </div>
              `;
            });
          }

          html += `
            <div class="bg-card border border-border p-4 rounded-2xl shadow-sm space-y-3">
              <div class="flex justify-between items-start border-b border-border pb-2">
                <div>
                  <h3 class="font-bold text-sm text-foreground">${kayit.musteriAdi}</h3>
                  <p class="text-[11px] text-muted-foreground">Tel: ${kayit.telefon} | İBAN: ${kayit.iban}</p>
                </div>
                <span class="text-xs font-bold px-2.5 py-1 rounded-lg bg-primary/10 text-primary">${kayit.kesimTipi}</span>
              </div>
              
              <div class="space-y-1">
                <p class="text-[11px] font-bold text-muted-foreground">Kesilen Hayvanlar:</p>
                ${hayvanlarHtml}
              </div>

              <div class="flex justify-between items-center pt-2 border-t border-border/60 text-xs">
                <span class="font-semibold text-muted-foreground">Toplam Tutar:</span>
                <span class="font-extrabold text-success text-base">${Number(kayit.toplamTutar || 0).toLocaleString('tr-TR', {minimumFractionDigits: 2})} TL</span>
              </div>
            </div>
          `;
        });

        kesimListesiContainer.innerHTML = html;
      }
    });
  </script>
</body>
</html>
