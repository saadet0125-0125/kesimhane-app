<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kesim Listesi — Kesimhane</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          background: 'rgb(244 247 248 / <alpha-value>)',
          foreground: 'rgb(23 36 45 / <alpha-value>)',
          primary: { DEFAULT: 'rgb(18 48 71 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          secondary: { DEFAULT: 'rgb(221 235 233 / <alpha-value>)', foreground: 'rgb(18 63 61 / <alpha-value>)' },
          accent: { DEFAULT: 'rgb(184 106 0 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          card: { DEFAULT: 'rgb(255 255 255 / <alpha-value>)', foreground: 'rgb(23 36 45 / <alpha-value>)' },
          border: 'rgb(201 213 217 / <alpha-value>)',
          muted: { DEFAULT: 'rgb(232 238 240 / <alpha-value>)', foreground: 'rgb(83 99 109 / <alpha-value>)' },
          success: { DEFAULT: 'rgb(44 110 73 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          destructive: { DEFAULT: 'rgb(180 35 24 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' }
        },
        fontFamily: { body: ['Inter', 'system-ui'] },
        borderRadius: { DEFAULT: '14px' }
      }}
    };
  </script>
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
</head>
<body class="bg-background text-foreground min-h-screen font-body pb-28">

  <header class="px-5 pb-4 pt-8 flex justify-between items-center">
    <div>
      <p class="text-xs font-semibold text-muted-foreground">Operasyon Yönetimi</p>
      <h1 class="text-2xl font-bold text-foreground">Kesim Listesi</h1>
    </div>
    <div class="flex items-center gap-2">
      <button id="yeni-ekle-modal-ac" class="text-xs font-bold bg-primary text-primary-foreground px-4 py-2.5 rounded-xl shadow hover:opacity-90 transition-all flex items-center gap-1.5">
        <iconify-icon icon="lucide:plus" class="text-base"></iconify-icon>
        Yeni Kesim Kaydı
      </button>
      <button id="temizle-kesim-btn" class="text-xs font-bold bg-destructive/10 text-destructive border border-destructive/20 p-2.5 rounded-xl shadow-sm hover:bg-destructive hover:text-white transition-all" title="Tümünü Temizle">
        <iconify-icon icon="lucide:trash-2" class="text-base"></iconify-icon>
      </button>
    </div>
  </header>

  <main class="px-5 space-y-4">
    <!-- KAYITLI LİSTE (ALT KISIMDA GÖRÜNEN KARTLAR) -->
    <div class="space-y-3" id="liste-container">
      <!-- Dinamik Kartlar Buraya Gelecek -->
    </div>
  </main>

  <!-- YENİ KESİM EKLEME MODALI (Görseldeki Tasarım) -->
  <div id="kesim-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-3 overflow-y-auto">
    <div class="bg-card w-full max-w-2xl rounded-2xl border border-border shadow-2xl p-5 space-y-4 my-auto max-h-[90vh] overflow-y-auto">
      
      <div class="flex justify-between items-center border-b border-border pb-3">
        <h3 class="text-sm font-bold text-foreground flex items-center gap-2">
          <iconify-icon icon="lucide:file-plus" class="text-primary text-lg"></iconify-icon>
          Yeni Detaylı Kesim Kaydı
        </h3>
        <button id="modal-kapat" class="text-muted-foreground hover:text-foreground">
          <iconify-icon icon="lucide:x" class="text-lg"></iconify-icon>
        </button>
      </div>

      <form id="kesim-form" class="space-y-4 text-xs">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-muted-foreground mb-1">Müşteri Adı</label>
            <input type="text" id="musteri" required class="w-full bg-background border border-border px-3 py-2 rounded-xl outline-none font-semibold">
          </div>
          <div>
            <label class="block font-bold text-muted-foreground mb-1">Telefon</label>
            <input type="text" id="telefon" class="w-full bg-background border border-border px-3 py-2 rounded-xl outline-none font-semibold">
          </div>
          <div>
            <label class="block font-bold text-muted-foreground mb-1">IBAN Numarası</label>
            <input type="text" id="iban" placeholder="TR..." class="w-full bg-background border border-border px-3 py-2 rounded-xl outline-none font-semibold font-mono">
          </div>
          <div>
            <label class="block font-bold text-muted-foreground mb-1">Kısa Adres / Şehir</label>
            <input type="text" id="adres" placeholder="DENİZLİ" class="w-full bg-background border border-border px-3 py-2 rounded-xl outline-none font-semibold">
          </div>
          <div>
            <label class="block font-bold text-muted-foreground mb-1">Kesim Tipi</label>
            <select id="kesimTipi" class="w-full bg-background border border-border px-3 py-2 rounded-xl outline-none font-semibold">
              <option value="Standart Kesim">Standart Kesim (%1.5 Stopaj Dâhil)</option>
              <option value="Özel Kesim">Özel Kesim</option>
              <option value="Faturalı Kesim">Faturalı Kesim (+%1 KDV)</option>
            </select>
          </div>
          <div>
            <label class="block font-bold text-muted-foreground mb-1">Kesen Personel / Kasap</label>
            <input type="text" id="kasap" placeholder="Örn: Ahmet Usta" class="w-full bg-background border border-border px-3 py-2 rounded-xl outline-none font-semibold">
          </div>
        </div>

        <!-- HAYVANLAR LİSTESİ ALANI -->
        <div class="space-y-3 pt-2 border-t border-border">
          <div class="flex justify-between items-center">
            <span class="font-bold text-foreground text-xs">Kesilen Hayvanlar</span>
            <button type="button" id="hayvan-ekle-btn" class="bg-secondary text-secondary-foreground font-bold px-3 py-1.5 rounded-xl text-[11px] hover:opacity-90 flex items-center gap-1">
              <iconify-icon icon="lucide:plus" class="text-sm"></iconify-icon> + Hayvan Ekle
            </button>
          </div>

          <div id="hayvanlar-container" class="space-y-3">
            <!-- Hayvan Satırı Örneği -->
            <div class="hayvan-satir bg-muted/20 border border-border p-3 rounded-xl relative space-y-2">
              <div class="flex justify-between items-center">
                <span class="font-bold text-primary text-[11px]">Hayvan #1</span>
                <button type="button" class="hayvan-sil text-destructive hover:opacity-80 text-xs hidden">
                  <iconify-icon icon="lucide:trash-2" class="text-sm"></iconify-icon>
                </button>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <div>
                  <label class="block font-semibold text-muted-foreground text-[10px] mb-0.5">Cinsi</label>
                  <select class="cinsi w-full bg-background border border-border px-2.5 py-1.5 rounded-lg outline-none font-semibold">
                    <option value="İnek">İnek</option>
                    <option value="Dana">Dana</option>
                    <option value="Düve">Düve</option>
                    <option value="Koyun">Koyun</option>
                    <option value="Kuzu">Kuzu</option>
                  </select>
                </div>
                <div>
                  <label class="block font-semibold text-muted-foreground text-[10px] mb-0.5">Kod / Küpe No</label>
                  <input type="text" required class="kupeNo w-full bg-background border border-border px-2.5 py-1.5 rounded-lg outline-none font-semibold uppercase">
                </div>
                <div>
                  <label class="block font-semibold text-muted-foreground text-[10px] mb-0.5">Ağırlık (Kg)</label>
                  <input type="number" step="0.01" required class="agirlik w-full bg-background border border-border px-2.5 py-1.5 rounded-lg outline-none font-semibold" placeholder="400">
                </div>
                <div>
                  <label class="block font-semibold text-muted-foreground text-[10px] mb-0.5">Birim Fiyat (TL/Kg)</label>
                  <input type="number" step="0.01" required class="birimFiyat w-full bg-background border border-border px-2.5 py-1.5 rounded-lg outline-none font-semibold" placeholder="280">
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- HESAPLAMA ÖZETİ -->
        <div class="bg-muted/40 p-3 rounded-xl border border-border space-y-1 text-xs">
          <div class="flex justify-between">
            <span class="text-muted-foreground">Ham Tutar (Kg × Birim Fiyat):</span>
            <span id="ham-tutar" class="font-bold text-foreground">0,00 TL</span>
          </div>
          <div class="flex justify-between text-destructive">
            <span id="kesinti-etiket">Uygulanan Oran:</span>
            <span id="kesinti-tutar">0,00 TL</span>
          </div>
          <div class="flex justify-between items-center pt-2 border-t border-border font-bold text-sm">
            <span class="text-foreground">Net Ödenecek Tutar:</span>
            <span id="net-tutar" class="text-success text-base font-extrabold">0,00 TL</span>
          </div>
        </div>

        <div class="pt-2 flex gap-2">
          <button type="submit" class="w-full bg-primary text-primary-foreground font-bold py-2.5 rounded-xl shadow hover:opacity-90 transition-all flex items-center justify-center gap-1.5">
            <iconify-icon icon="lucide:check" class="text-base"></iconify-icon>
            Kaydet ve Stoğa Aktar
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ALT NAVİGASYON -->
  <nav class="fixed inset-x-0 bottom-0 z-20 border-t border-border bg-card px-2 pb-4 pt-2 shadow-lg">
    <div class="mx-auto flex max-w-md items-center justify-between">
      <a href="ana-sayfa.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:house" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Ana Sayfa</span>
      </a>
      <a href="kesim-listesi.html" class="flex flex-col items-center gap-1 rounded-lg bg-primary px-3 py-1.5 text-primary-foreground">
        <iconify-icon icon="lucide:clipboard-list" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Kesim Listesi</span>
      </a>
      <a href="stok.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:package" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Stok</span>
      </a>
      <a href="sevkiyat.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:truck" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Sevkiyat</span>
      </a>
      <a href="g-n-sonu.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:circle-check-big" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Gün Sonu</span>
      </a>
    </div>
  </nav>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const modalAcBtn = document.getElementById('yeni-ekle-modal-ac');
      const modalKapatBtn = document.getElementById('modal-kapat');
      const kesimModal = document.getElementById('kesim-modal');
      const kesimForm = document.getElementById('kesim-form');
      const listeContainer = document.getElementById('liste-container');
      const temizleBtn = document.getElementById('temizle-kesim-btn');
      const hayvanEkleBtn = document.getElementById('hayvan-ekle-btn');
      const hayvanlarContainer = document.getElementById('hayvanlar-container');

      const hamTutarEl = document.getElementById('ham-tutar');
      const kesintiEtiketEl = document.getElementById('kesinti-etiket');
      const kesintiTutarEl = document.getElementById('kesinti-tutar');
      const netTutarEl = document.getElementById('net-tutar');
      const kesimTipiSelect = document.getElementById('kesimTipi');

      modalAcBtn.addEventListener('click', () => kesimModal.classList.remove('hidden'));
      modalKapatBtn.addEventListener('click', () => kesimModal.classList.add('hidden'));

      // Hayvan Ekle Satırı
      hayvanEkleBtn.addEventListener('click', () => {
        const index = hayvanlarContainer.querySelectorAll('.hayvan-satir').length + 1;
        const div = document.createElement('div');
        div.className = 'hayvan-satir bg-muted/20 border border-border p-3 rounded-xl relative space-y-2';
        div.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="font-bold text-primary text-[11px]">Hayvan #${index}</span>
            <button type="button" class="hayvan-sil text-destructive hover:opacity-80 text-xs">
              <iconify-icon icon="lucide:trash-2" class="text-sm"></iconify-icon>
            </button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div>
              <label class="block font-semibold text-muted-foreground text-[10px] mb-0.5">Cinsi</label>
              <select class="cinsi w-full bg-background border border-border px-2.5 py-1.5 rounded-lg outline-none font-semibold">
                <option value="İnek">İnek</option>
                <option value="Dana">Dana</option>
                <option value="Düve">Düve</option>
                <option value="Koyun">Koyun</option>
                <option value="Kuzu">Kuzu</option>
              </select>
            </div>
            <div>
              <label class="block font-semibold text-muted-foreground text-[10px] mb-0.5">Kod / Küpe No</label>
              <input type="text" required class="kupeNo w-full bg-background border border-border px-2.5 py-1.5 rounded-lg outline-none font-semibold uppercase">
            </div>
            <div>
              <label class="block font-semibold text-muted-foreground text-[10px] mb-0.5">Ağırlık (Kg)</label>
              <input type="number" step="0.01" required class="agirlik w-full bg-background border border-border px-2.5 py-1.5 rounded-lg outline-none font-semibold">
            </div>
            <div>
              <label class="block font-semibold text-muted-foreground text-[10px] mb-0.5">Birim Fiyat (TL/Kg)</label>
              <input type="number" step="0.01" required class="birimFiyat w-full bg-background border border-border px-2.5 py-1.5 rounded-lg outline-none font-semibold">
            </div>
          </div>
        `;
        hayvanlarContainer.appendChild(div);
        guncelleSilButonlari();
        hesaplaToplamlar();
      });

      function guncelleSilButonlari() {
        const satirlar = hayvanlarContainer.querySelectorAll('.hayvan-satir');
        satirlar.forEach((satir, idx) => {
          const silBtn = satir.querySelector('.hayvan-sil');
          if (satirlar.length > 1) {
            silBtn.classList.remove('hidden');
          } else {
            silBtn.classList.add('hidden');
          }
          silBtn.onclick = () => {
            satir.remove();
            hesaplaToplamlar();
          };
        });
      }

      hayvanlarContainer.addEventListener('input', hesaplaToplamlar);
      kesimTipiSelect.addEventListener('change', hesaplaToplamlar);

      function hesaplaToplamlar() {
        let ham = 0;
        const satirlar = hayvanlarContainer.querySelectorAll('.hayvan-satir');
        satirlar.forEach(satir => {
          const agirlik = parseFloat(satir.querySelector('.agirlik').value) || 0;
          const fiyat = parseFloat(satir.querySelector('.birimFiyat').value) || 0;
          ham += (agirlik * fiyat);
        });

        let kesinti = 0;
        const tip = kesimTipiSelect.value;
        if (tip.includes('Standart')) {
          kesinti = ham * 0.015;
          kesintiEtiketEl.textContent = 'Uygulanan Oran (%1.5 Stopaj):';
        } else if (tip.includes('Faturalı')) {
          kesinti = ham * 0.01;
          kesintiEtiketEl.textContent = 'Uygulanan Oran (+%1 KDV):';
        } else {
          kesintiEtiketEl.textContent = 'Özel Kesim Kesinti Yok:';
        }

        const net = tip.includes('Faturalı') ? (ham + kesinti) : (ham - (tip.includes('Standart') ? kesinti : 0));

        hamTutarEl.textContent = `${ham.toLocaleString('tr-TR', {minimumFractionDigits: 2})} TL`;
        kesintiTutarEl.textContent = `${kesinti.toLocaleString('tr-TR', {minimumFractionDigits: 2})} TL`;
        netTutarEl.textContent = `${net.toLocaleString('tr-TR', {minimumFractionDigits: 2})} TL`;
      }

      // Listeyi Ekrana Bas
      function listeyiGoster() {
        const stoklar = JSON.parse(localStorage.getItem('stoklar')) || [];
        if (stoklar.length === 0) {
          listeContainer.innerHTML = `
            <div class="bg-card border border-border rounded-2xl p-6 text-center text-muted-foreground text-xs">
              Henüz kayıtlı kesim bulunmuyor. Üst plandaki "Yeni Kesim Kaydı" butonunu kullanın.
            </div>
          `;
          return;
        }

        listeContainer.innerHTML = stoklar.map((item, index) => `
          <div class="bg-card border border-border rounded-2xl p-4 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 text-xs">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="font-extrabold text-foreground text-sm">${item.musteri}</span>
                <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-primary/10 text-primary">${item.kesimTipi}</span>
              </div>
              <p class="text-muted-foreground">Tel: ${item.telefon || '-'} | İBAN: ${item.iban || '-'}</p>
              <div class="flex flex-wrap gap-1.5 pt-1">
                ${(item.hayvanlar || []).map(h => `
                  <span class="bg-muted/50 border border-border px-2 py-0.5 rounded text-[10px] font-semibold">
                    ${h.cinsi} (${h.kupeNo}) - ${h.agirlik} kg
                  </span>
                `).join('')}
              </div>
              <p class="text-[10px] text-muted-foreground">Kayıt Tarihi: ${item.tarih} | Kesen: ${item.kasap || '-'}</p>
            </div>
            
            <div class="flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-end border-t sm:border-t-0 pt-2 sm:pt-0 border-border">
              <span class="font-extrabold text-success text-base">${parseFloat(item.maliyet || 0).toLocaleString('tr-TR', {minimumFractionDigits: 2})} TL</span>
              <button onclick="kaydiSil(${index})" class="bg-destructive/10 text-destructive p-2 rounded-xl hover:bg-destructive hover:text-white transition-all">
                <iconify-icon icon="lucide:trash-2" class="text-base"></iconify-icon>
              </button>
            </div>
          </div>
        `).join('');
      }

      // Form Kaydetme
      kesimForm.addEventListener('submit', function (e) {
        e.preventDefault();
        const simdi = new Date();
        const bugunStr = `${simdi.getFullYear()}-${String(simdi.getMonth() + 1).padStart(2, '0')}-${String(simdi.getDate()).padStart(2, '0')}`;

        let toplamNetTutar = 0;
        const hayvanlarDizi = [];

        document.querySelectorAll('.hayvan-satir').forEach(satir => {
          const agirlik = parseFloat(satir.querySelector('.agirlik').value) || 0;
          const birimFiyat = parseFloat(satir.querySelector('.birimFiyat').value) || 0;
          const cinsi = satir.querySelector('.cinsi').value;
          const kupeNo = satir.querySelector('.kupeNo').value;
          
          toplamNetTutar += (agirlik * birimFiyat);
          hayvanlarDizi.push({ cinsi, kupeNo, agirlik, birimFiyat });
        });

        const tip = kesimTipiSelect.value;
        if (tip.includes('Standart')) toplamNetTutar *= (1 - 0.015);
        if (tip.includes('Faturalı')) toplamNetTutar *= 1.01;

        const yeniKayit = {
          id: Date.now(),
          tarih: bugunStr,
          musteri: document.getElementById('musteri').value,
          telefon: document.getElementById('telefon').value,
          iban: document.getElementById('iban').value,
          adres: document.getElementById('adres').value,
          kasap: document.getElementById('kasap').value,
          kesimTipi: tip,
          hayvanlar: hayvanlarDizi,
          maliyet: toplamNetTutar,
          odendi: false
        };

        const stoklar = JSON.parse(localStorage.getItem('stoklar')) || [];
        stoklar.push(yeniKayit);
        localStorage.setItem('stoklar', JSON.stringify(stoklar));

        kesimForm.reset();
        kesimModal.classList.add('hidden');
        listeyiGoster();
        alert('Kesim başarıyla kaydedildi ve tüm panellere aktarıldı!');
      });

      window.kaydiSil = function(index) {
        if (confirm('Bu kaydı silmek istediğinize emin misiniz?')) {
          let stoklar = JSON.parse(localStorage.getItem('stoklar')) || [];
          stoklar.splice(index, 1);
          localStorage.setItem('stoklar', JSON.stringify(stoklar));
          listeyiGoster();
        }
      };

      temizleBtn.addEventListener('click', function() {
        if (confirm('Tüm kesim listesini tamamen sıfırlamak istediğinize emin misiniz?')) {
          localStorage.removeItem('stoklar');
          listeyiGoster();
        }
      });

      listeyiGoster();
    });
  </script>
</body>
</html>
