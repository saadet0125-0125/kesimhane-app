<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kesim Listesi — Kesimhane</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          background: 'rgb(244 247 248 / <alpha-value>)',
          foreground: 'rgb(23 36 45 / <alpha-value>)',
          primary: { DEFAULT: 'rgb(18 48 71 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          secondary: { DEFAULT: 'rgb(221 235 233 / <alpha-value>)', foreground: 'rgb(18 63 61 / <alpha-value>)' },
          accent: { DEFAULT: 'rgb(184 106 0 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          card: { DEFAULT: 'rgb(255 255 255 / <alpha-value>)', foreground: 'rgb(23 36 45 / <alpha-value>)' },
          border: 'rgb(201 213 217 / <alpha-value>)',
          muted: { DEFAULT: 'rgb(232 238 240 / <alpha-value>)', foreground: 'rgb(83 99 109 / <alpha-value>)' },
          success: { DEFAULT: 'rgb(44 110 73 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          destructive: { DEFAULT: 'rgb(180 35 24 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' }
        },
        fontFamily: { body: ['Inter', 'system-ui'] },
        borderRadius: { DEFAULT: '14px' }
      }}
    };
  </script>
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
</head>
<body class="bg-background text-foreground min-h-screen font-body pb-28">

  <header class="px-5 pb-4 pt-8 flex justify-between items-center">
    <div>
      <p class="text-xs font-semibold text-muted-foreground">Operasyon Yönetimi</p>
      <h1 class="text-2xl font-bold text-foreground">Kesim Listesi</h1>
    </div>
    <button id="temizle-kesim-btn" class="text-xs font-bold bg-destructive/10 text-destructive border border-destructive/20 px-3 py-2 rounded-xl shadow-sm hover:bg-destructive hover:text-white transition-all flex items-center gap-1.5">
      <iconify-icon icon="lucide:trash-2" class="text-sm"></iconify-icon>
      Listeyi Temizle
    </button>
  </header>

  <main class="px-5 space-y-4">
    <!-- FORM -->
    <div class="bg-card border border-border rounded-2xl p-4 shadow-sm space-y-3">
      <h3 class="text-xs font-bold text-foreground flex items-center gap-2 border-b border-border pb-2">
        <iconify-icon icon="lucide:plus-circle" class="text-primary text-base"></iconify-icon>
        Yeni Hayvan / Kesim Ekle
      </h3>
      
      <form id="kesim-form" class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
        <div>
          <label class="block font-bold text-muted-foreground mb-1">Müşteri Adı</label>
          <input type="text" id="musteri" required class="w-full bg-background border border-border px-3 py-2 rounded-xl outline-none font-semibold">
        </div>
        <div>
          <label class="block font-bold text-muted-foreground mb-1">Telefon</label>
          <input type="text" id="telefon" class="w-full bg-background border border-border px-3 py-2 rounded-xl outline-none font-semibold">
        </div>
        <div>
          <label class="block font-bold text-muted-foreground mb-1">IBAN</label>
          <input type="text" id="iban" class="w-full bg-background border border-border px-3 py-2 rounded-xl outline-none font-semibold">
        </div>
        <div>
          <label class="block font-bold text-muted-foreground mb-1">Küpe Numarası</label>
          <input type="text" id="kupeNo" required class="w-full bg-background border border-border px-3 py-2 rounded-xl outline-none font-semibold">
        </div>
        <div>
          <label class="block font-bold text-muted-foreground mb-1">Cins / Tür</label>
          <input type="text" id="cins" placeholder="Örn: Düve / İnek" required class="w-full bg-background border border-border px-3 py-2 rounded-xl outline-none font-semibold">
        </div>
        <div>
          <label class="block font-bold text-muted-foreground mb-1">Kesim Türü</label>
          <select id="kesimTipi" class="w-full bg-background border border-border px-3 py-2 rounded-xl outline-none font-semibold">
            <option value="Standart Kesim">Standart Kesim</option>
            <option value="Faturalı Kesim">Faturalı Kesim (+%1 KDV)</option>
          </select>
        </div>
        <div>
          <label class="block font-bold text-muted-foreground mb-1">Ağırlık (kg)</label>
          <input type="number" step="0.01" id="agirlik" required class="w-full bg-background border border-border px-3 py-2 rounded-xl outline-none font-semibold">
        </div>
        <div>
          <label class="block font-bold text-muted-foreground mb-1">Toplam Tutar (TL)</label>
          <input type="number" step="0.01" id="maliyet" required class="w-full bg-background border border-border px-3 py-2 rounded-xl outline-none font-semibold text-success font-extrabold">
        </div>
        
        <div class="sm:col-span-2 pt-2">
          <button type="submit" class="w-full bg-primary text-primary-foreground font-bold py-2.5 rounded-xl shadow-md hover:opacity-90 transition-all flex items-center justify-center gap-1.5">
            <iconify-icon icon="lucide:check" class="text-base"></iconify-icon>
            Listeye Kaydet
          </button>
        </div>
      </form>
    </div>

    <!-- KAYITLI LİSTE -->
    <div class="bg-card border border-border rounded-2xl p-4 shadow-sm space-y-3">
      <h3 class="text-xs font-bold text-foreground flex items-center gap-2 border-b border-border pb-2">
        <iconify-icon icon="lucide:list" class="text-primary text-base"></iconify-icon>
        Güncel Kesim Listesi
      </h3>
      <div id="liste-container" class="space-y-2">
        <!-- Dinamik liste -->
      </div>
    </div>
  </main>

  <!-- ALT NAVİGASYON -->
  <nav class="fixed inset-x-0 bottom-0 z-20 border-t border-border bg-card px-2 pb-4 pt-2 shadow-lg">
    <div class="mx-auto flex max-w-md items-center justify-between">
      <a href="ana-sayfa.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:house" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Ana Sayfa</span>
      </a>
      <a href="kesim-listesi.html" class="flex flex-col items-center gap-1 rounded-lg bg-primary px-3 py-1.5 text-primary-foreground">
        <iconify-icon icon="lucide:clipboard-list" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Kesim Listesi</span>
      </a>
      <a href="stok.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:package" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Stok</span>
      </a>
      <a href="sevkiyat.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:truck" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Sevkiyat</span>
      </a>
      <a href="g-n-sonu.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:circle-check-big" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Gün Sonu</span>
      </a>
    </div>
  </nav>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const form = document.getElementById('kesim-form');
      const listeContainer = document.getElementById('liste-container');
      const temizleBtn = document.getElementById('temizle-kesim-btn');

      function listeyiGoster() {
        const stoklar = JSON.parse(localStorage.getItem('stoklar')) || [];
        if (stoklar.length === 0) {
          listeContainer.innerHTML = `<p class="text-xs text-muted-foreground text-center py-4">Henüz kayıtlı kesim bulunmuyor.</p>`;
          return;
        }

        listeContainer.innerHTML = stoklar.map((item, index) => `
          <div class="bg-muted/30 border border-border/70 rounded-xl p-3 flex justify-between items-center text-xs">
            <div>
              <span class="font-bold text-foreground">${item.musteri}</span>
              <span class="text-[10px] bg-secondary text-secondary-foreground px-1.5 py-0.5 rounded ml-1">${item.kupeNo} (${item.cins})</span>
              <p class="text-[10px] text-muted-foreground mt-0.5">${item.kesimTipi} - ${item.agirlik} kg</p>
            </div>
            <div class="flex items-center gap-3">
              <span class="font-extrabold text-foreground">${parseFloat(item.maliyet || 0).toLocaleString('tr-TR', {minimumFractionDigits: 2})} TL</span>
              <button onclick="kaydiSil(${index})" class="text-destructive hover:opacity-80 p-1">
                <iconify-icon icon="lucide:trash" class="text-sm"></iconify-icon>
              </button>
            </div>
          </div>
        `).join('');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const simdi = new Date();
        const bugunStr = `${simdi.getFullYear()}-${String(simdi.getMonth() + 1).padStart(2, '0')}-${String(simdi.getDate()).padStart(2, '0')}`;

        const yeniKayit = {
          id: Date.now(),
          tarih: bugunStr,
          musteri: document.getElementById('musteri').value,
          telefon: document.getElementById('telefon').value,
          iban: document.getElementById('iban').value,
          kupeNo: document.getElementById('kupeNo').value,
          cins: document.getElementById('cins').value,
          kesimTipi: document.getElementById('kesimTipi').value,
          agirlik: document.getElementById('agirlik').value,
          maliyet: document.getElementById('maliyet').value,
          odendi: false
        };

        const stoklar = JSON.parse(localStorage.getItem('stoklar')) || [];
        stoklar.push(yeniKayit);
        localStorage.setItem('stoklar', JSON.stringify(stoklar));

        form.reset();
        listeyiGoster();
        alert('Kesim başarıyla eklendi!');
      });

      window.kaydiSil = function(index) {
        let stoklar = JSON.parse(localStorage.getItem('stoklar')) || [];
        stoklar.splice(index, 1);
        localStorage.setItem('stoklar', JSON.stringify(stoklar));
        listeyiGoster();
      };

      temizleBtn.addEventListener('click', function() {
        if (confirm('Tüm kesim listesini silmek istediğinize emin misiniz?')) {
          localStorage.removeItem('stoklar');
          listeyiGoster();
        }
      });

      listeyiGoster();
    });
  </script>
</body>
</html>
