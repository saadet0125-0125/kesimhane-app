<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kesim Listesi — Kesimhane</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          background: 'rgb(244 247 248 / <alpha-value>)',
          foreground: 'rgb(23 36 45 / <alpha-value>)',
          primary: { DEFAULT: 'rgb(18 48 71 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          secondary: { DEFAULT: 'rgb(221 235 233 / <alpha-value>)', foreground: 'rgb(18 63 61 / <alpha-value>)' },
          accent: { DEFAULT: 'rgb(184 106 0 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          card: { DEFAULT: 'rgb(255 255 255 / <alpha-value>)', foreground: 'rgb(23 36 45 / <alpha-value>)' },
          border: 'rgb(201 213 217 / <alpha-value>)',
          muted: { DEFAULT: 'rgb(232 238 240 / <alpha-value>)', foreground: 'rgb(83 99 109 / <alpha-value>)' },
          success: { DEFAULT: 'rgb(44 110 73 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          destructive: { DEFAULT: 'rgb(180 35 24 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' }
        },
        fontFamily: { body: ['Inter', 'system-ui'] },
        borderRadius: { DEFAULT: '14px' }
      }}
    };
  </script>
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
</head>
<body class="bg-background text-foreground min-h-screen font-body pb-28">

  <header class="px-5 pb-4 pt-8 flex justify-between items-center">
    <div>
      <p class="text-xs font-semibold text-muted-foreground">Et Entegre Tesisi Üretim</p>
      <h1 class="text-2xl font-bold text-foreground">Kesim Listesi</h1>
    </div>
    <button id="open-modal-btn" class="flex items-center gap-1.5 bg-primary text-primary-foreground text-xs font-bold px-4 py-2.5 rounded-xl shadow hover:opacity-90 transition-all">
      <iconify-icon icon="lucide:plus-circle" class="text-base"></iconify-icon>
      Yeni Kesim Kaydı
    </button>
  </header>

  <main class="px-5 space-y-4">
    <!-- ARAMA / FİLTRE -->
    <div class="flex items-center gap-2 bg-card p-2 rounded-xl border border-border shadow-sm">
      <iconify-icon icon="lucide:search" class="text-muted-foreground text-lg ml-1"></iconify-icon>
      <input type="text" id="search-input" placeholder="Müşteri adı veya küpe no ile ara..." class="w-full bg-transparent text-xs outline-none">
    </div>

    <!-- KESİM LİSTESİ -->
    <div id="kesim-listesi-container" class="space-y-3">
      <!-- Dinamik İçerik -->
    </div>
  </main>

  <!-- YENİ KESİM KAYDI MODAL -->
  <div id="kesim-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-card w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-2xl border border-border shadow-2xl p-6 space-y-5">
      <div class="flex justify-between items-center border-b border-border pb-3">
        <h2 class="text-base font-bold text-foreground flex items-center gap-2">
          <iconify-icon icon="lucide:plus-circle" class="text-primary"></iconify-icon>
          Yeni Kesim Kaydı Oluştur
        </h2>
        <button id="close-modal-btn" class="text-muted-foreground hover:text-foreground">
          <iconify-icon icon="lucide:x" class="text-xl"></iconify-icon>
        </button>
      </div>

      <form id="kesim-form" class="space-y-4">
        <!-- Müşteri Bilgileri -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-semibold text-muted-foreground mb-1">Müşteri Adı Soyadı</label>
            <input type="text" id="m-ad" required placeholder="Ad Soyad" class="w-full rounded-lg border border-border p-2 text-xs focus:ring-1 focus:ring-primary outline-none">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-muted-foreground mb-1">TC Kimlik / Vergi No</label>
            <input type="text" id="m-tc" maxlength="11" placeholder="11 haneli TC No" class="w-full rounded-lg border border-border p-2 text-xs focus:ring-1 focus:ring-primary outline-none">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-muted-foreground mb-1">IBAN Numarası</label>
            <input type="text" id="m-iban" placeholder="TR00 0000..." class="w-full rounded-lg border border-border p-2 text-xs focus:ring-1 focus:ring-primary outline-none">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-muted-foreground mb-1">Kısa Adres</label>
            <input type="text" id="m-adres" placeholder="İl, İlçe" class="w-full rounded-lg border border-border p-2 text-xs focus:ring-1 focus:ring-primary outline-none">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-muted-foreground mb-1">Kesim Tipi</label>
            <select id="m-kesim-tipi" class="w-full rounded-lg border border-border p-2 text-xs focus:ring-1 focus:ring-primary outline-none bg-card font-semibold">
              <option value="Standart Kesim (%1.5 Stopaj)">Standart Kesim (%1.5 Stopaj Dâhil)</option>
              <option value="Faturalı Kesim (+%1 KDV)">Faturalı Kesim (+%1 KDV)</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-muted-foreground mb-1">Kesen Personel / Kasap</label>
            <input type="text" id="m-kasap" placeholder="Örn: Ahmet Usta" class="w-full rounded-lg border border-border p-2 text-xs focus:ring-1 focus:ring-primary outline-none">
          </div>
        </div>

        <!-- Kesilecek Hayvanlar -->
        <div class="space-y-3 pt-2">
          <div class="flex justify-between items-center border-b border-border pb-2">
            <span class="text-xs font-bold text-foreground flex items-center gap-1.5">
              <iconify-icon icon="lucide:beef" class="text-primary"></iconify-icon>
              Kesilecek Hayvanlar
            </span>
            <button type="button" id="add-animal-btn" class="text-xs font-bold text-primary bg-secondary/60 hover:bg-secondary px-3 py-1 rounded-lg flex items-center gap-1">
              + Hayvan Ekle
            </button>
          </div>

          <div id="animal-container" class="space-y-3">
            <!-- Dinamik Hayvan Satırları -->
          </div>
        </div>

        <!-- Hesaplama Özeti -->
        <div class="rounded-xl bg-muted/30 border border-border p-3 space-y-1">
          <div class="flex justify-between items-center text-xs">
            <span class="text-muted-foreground">Ham Tutar (Kg × Birim Fiyat):</span>
            <span id="summary-ham" class="font-bold text-foreground">0,00 TL</span>
          </div>
          <div class="flex justify-between items-center text-xs">
            <span class="text-muted-foreground">Uygulanan Oran:</span>
            <span id="summary-stopaj" class="font-bold text-destructive">-%1.5 Stopaj</span>
          </div>
          <div class="flex justify-between items-center text-sm pt-1 border-t border-border/50">
            <span class="font-bold text-foreground">Net Ödenecek Tutar:</span>
            <span id="summary-net" class="font-extrabold text-success text-base">0,00 TL</span>
          </div>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" id="print-fis-btn" class="w-1/2 py-2.5 rounded-xl border border-border font-bold text-xs hover:bg-muted/50 flex items-center justify-center gap-1.5">
            <iconify-icon icon="lucide:printer"></iconify-icon> Fiş Yazdır
          </button>
          <button type="submit" class="w-1/2 py-2.5 rounded-xl bg-primary text-primary-foreground font-bold text-xs hover:opacity-90 shadow">
            Kaydet ve Stoğa Aktar
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ALT NAVİGASYON -->
  <nav class="fixed inset-x-0 bottom-0 z-20 border-t border-border bg-card px-2 pb-4 pt-2 shadow-lg">
    <div class="mx-auto flex max-w-md items-center justify-between">
      <a href="ana-sayfa.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:house" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Ana Sayfa</span>
      </a>
      <a href="kesim-listesi.html" class="flex flex-col items-center gap-1 rounded-lg bg-primary px-3 py-1.5 text-primary-foreground">
        <iconify-icon icon="lucide:clipboard-list" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Kesim Listesi</span>
      </a>
      <a href="stok.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:package" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Stok</span>
      </a>
      <a href="sevkiyat.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:truck" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Sevkiyat</span>
      </a>
      <a href="g-n-sonu.html" class="flex flex-col items-center gap-1 text-muted-foreground">
        <iconify-icon icon="lucide:circle-check-big" class="text-xl"></iconify-icon>
        <span class="text-[10px] font-bold">Gün Sonu</span>
      </a>
    </div>
  </nav>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const modal = document.getElementById('kesim-modal');
      const openBtn = document.getElementById('open-modal-btn');
      const closeBtn = document.getElementById('close-modal-btn');
      const animalContainer = document.getElementById('animal-container');
      const addAnimalBtn = document.getElementById('add-animal-btn');
      const kesimForm = document.getElementById('kesim-form');
      const listContainer = document.getElementById('kesim-listesi-container');
      const searchInput = document.getElementById('search-input');
      const kesimTipiSelect = document.getElementById('m-kesim-tipi');

      openBtn.addEventListener('click', () => {
        modal.classList.remove('hidden');
        if (animalContainer.children.length === 0) {
          addAnimalRow();
        }
      });

      closeBtn.addEventListener('click', () => modal.classList.add('hidden'));

      // Stok durumuna göre numara üreten kod
      function getNextCodeForForm(cins, currentRowIndex) {
        const upperCins = cins.toUpperCase().trim();
        const tumStoklar = JSON.parse(localStorage.getItem('stoklar')) || [];
        const aktifStoklar = tumStoklar.filter(item => !item.durum || item.durum === 'stokta');

        let maxNumber = 0;

        aktifStoklar.forEach(item => {
          const code = (item.kupeNo || item.animalId || '').toUpperCase();
          if (code.startsWith(upperCins)) {
            const numMatch = code.replace(upperCins, '').match(/\d+/);
            if (numMatch) {
              const num = parseInt(numMatch[0], 10);
              if (num > maxNumber) maxNumber = num;
            }
          }
        });

        const activeRows = animalContainer.querySelectorAll('.animal-row');
        let sameCinsCountInForm = 0;
        
        activeRows.forEach((r, idx) => {
          if (idx < currentRowIndex) {
            const selCins = r.querySelector('.animal-cins')?.value;
            if (selCins && selCins.toUpperCase().trim() === upperCins) {
              sameCinsCountInForm++;
            }
          }
        });

        const nextNum = maxNumber + sameCinsCountInForm + 1;
        return `${upperCins}${nextNum}`;
      }

      function addAnimalRow() {
        const rowId = Date.now();
        const rowIdx = animalContainer.children.length;

        const row = document.createElement('div');
        row.className = 'animal-row bg-background p-3 rounded-xl border border-border/80 space-y-2 relative';
        row.dataset.id = rowId;

        row.innerHTML = `
          <div class="flex justify-between items-center text-xs font-bold text-muted-foreground">
            <span>Hayvan #${rowIdx + 1}</span>
            ${rowIdx > 0 ? `<button type="button" class="remove-row-btn text-destructive hover:underline text-[11px]">Sil</button>` : ''}
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] font-semibold text-muted-foreground mb-1">Cinsi</label>
              <select class="animal-cins w-full rounded-lg border border-border p-1.5 text-xs bg-card outline-none">
                <option value="İnek">İnek</option>
                <option value="Dana">Dana</option>
                <option value="Düve">Düve</option>
                <option value="Tosun">Tosun</option>
                <option value="Koyun">Koyun</option>
              </select>
            </div>
            <div>
              <label class="block text-[10px] font-semibold text-muted-foreground mb-1">Kod / Küpe No</label>
              <input type="text" class="animal-code w-full rounded-lg border border-border p-1.5 text-xs bg-muted/40 font-bold text-primary" readonly>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] font-semibold text-muted-foreground mb-1">Ağırlık (Kg)</label>
              <input type="number" step="0.1" class="animal-kg w-full rounded-lg border border-border p-1.5 text-xs outline-none" value="0">
            </div>
            <div>
              <label class="block text-[10px] font-semibold text-muted-foreground mb-1">Birim Fiyat (TL/Kg)</label>
              <input type="number" step="0.1" class="animal-price w-full rounded-lg border border-border p-1.5 text-xs outline-none" value="0">
            </div>
          </div>
        `;

        animalContainer.appendChild(row);

        const cinsSelect = row.querySelector('.animal-cins');
        const codeInput = row.querySelector('.animal-code');

        codeInput.value = getNextCodeForForm(cinsSelect.value, rowIdx);

        cinsSelect.addEventListener('change', () => updateAllRowCodes());

        row.querySelectorAll('.animal-kg, .animal-price').forEach(input => {
          input.addEventListener('input', calculateTotal);
        });

        const removeBtn = row.querySelector('.remove-row-btn');
        if (removeBtn) {
          removeBtn.addEventListener('click', () => {
            row.remove();
            updateAllRowCodes();
            calculateTotal();
          });
        }

        calculateTotal();
      }

      function updateAllRowCodes() {
        const rows = animalContainer.querySelectorAll('.animal-row');
        rows.forEach((r, idx) => {
          const cinsSel = r.querySelector('.animal-cins');
          const codeInp = r.querySelector('.animal-code');
          if (cinsSel && codeInp) {
            codeInp.value = getNextCodeForForm(cinsSel.value, idx);
          }
        });
      }

      addAnimalBtn.addEventListener('click', addAnimalRow);
      kesimTipiSelect.addEventListener('change', calculateTotal);

      // HESAPLAMA MANTIĞI: KDV VEYA STOPAJ
      function calculateTotal() {
        let totalHam = 0;
        const kesimTipi = kesimTipiSelect.value;

        document.querySelectorAll('.animal-row').forEach(row => {
          const kg = parseFloat(row.querySelector('.animal-kg').value) || 0;
          const price = parseFloat(row.querySelector('.animal-price').value) || 0;
          totalHam += (kg * price);
        });

        const summaryStopajEl = document.getElementById('summary-stopaj');
        let netTutar = totalHam;

        if (kesimTipi.includes('Faturalı')) {
          const kdvTutar = totalHam * 0.01; // %1 KDV ekle
          netTutar = totalHam + kdvTutar;
          summaryStopajEl.textContent = `+%1 KDV (+${kdvTutar.toLocaleString('tr-TR', {minimumFractionDigits:2})} TL)`;
          summaryStopajEl.className = 'font-bold text-success';
        } else {
          const stopajTutar = totalHam * 0.015; // %1.5 Stopaj düş
          netTutar = totalHam - stopajTutar;
          summaryStopajEl.textContent = `-%1.5 Stopaj (-${stopajTutar.toLocaleString('tr-TR', {minimumFractionDigits:2})} TL)`;
          summaryStopajEl.className = 'font-bold text-destructive';
        }

        document.getElementById('summary-ham').textContent = `${totalHam.toLocaleString('tr-TR', {minimumFractionDigits: 2})} TL`;
        document.getElementById('summary-net').textContent = `${netTutar.toLocaleString('tr-TR', {minimumFractionDigits: 2})} TL`;
      }

      // KAYIT İŞLEMİ
      kesimForm.addEventListener('submit', function (e) {
        e.preventDefault();

        const musteri = document.getElementById('m-ad').value;
        const tc = document.getElementById('m-tc').value;
        const iban = document.getElementById('m-iban').value;
        const adres = document.getElementById('m-adres').value;
        const kesimTipi = kesimTipiSelect.value;
        const kasap = document.getElementById('m-kasap').value;

        const rows = animalContainer.querySelectorAll('.animal-row');
        if (rows.length === 0) {
          alert('Lütfen en az bir hayvan ekleyin.');
          return;
        }

        let yeniStoklar = [];
        const bugun = new Date().toLocaleDateString('tr-TR');

        rows.forEach(row => {
          const cins = row.querySelector('.animal-cins').value;
          const code = row.querySelector('.animal-code').value;
          const kg = parseFloat(row.querySelector('.animal-kg').value) || 0;
          const price = parseFloat(row.querySelector('.animal-price').value) || 0;
          const hamMaliyet = kg * price;
          
          let netMaliyet = hamMaliyet;
          if (kesimTipi.includes('Faturalı')) {
            netMaliyet = hamMaliyet + (hamMaliyet * 0.01); // KDV ekleme
          } else {
            netMaliyet = hamMaliyet - (hamMaliyet * 0.015); // Stopaj düşme
          }

          yeniStoklar.push({
            id: Date.now() + Math.random(),
            musteri, tc, iban, adres, kesimTipi, kasap,
            cins,
            kupeNo: code,
            animalId: code,
            agirlik: kg,
            birimFiyat: price,
            hamMaliyet: hamMaliyet,
            maliyet: netMaliyet,
            tarih: bugun,
            durum: 'stokta'
          });
        });

        let mevcutStoklar = JSON.parse(localStorage.getItem('stoklar')) || [];
        mevcutStoklar = [...mevcutStoklar, ...yeniStoklar];
        localStorage.setItem('stoklar', JSON.stringify(mevcutStoklar));

        kesimForm.reset();
        animalContainer.innerHTML = '';
        modal.classList.add('hidden');

        listeyiYukle();
        alert(`${yeniStoklar.length} adet hayvan kaydedildi ve stoğa eklendi.`);
      });

      function listeyiYukle() {
        const tumStoklar = JSON.parse(localStorage.getItem('stoklar')) || [];
        const arama = searchInput.value.toLowerCase('tr-TR');

        const filtrelenmiş = tumStoklar.filter(item => 
          (item.musteri || '').toLowerCase('tr-TR').includes(arama) || 
          (item.kupeNo || item.animalId || '').toLowerCase('tr-TR').includes(arama)
        );

        if (filtrelenmiş.length === 0) {
          listContainer.innerHTML = `<div class="p-8 text-center text-xs text-muted-foreground">Kayıtlı kesim bulunamadı.</div>`;
          return;
        }

        listContainer.innerHTML = filtrelenmiş.reverse().map(item => `
          <div class="bg-card border border-border rounded-xl p-4 shadow-sm flex items-center justify-between">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold bg-secondary text-secondary-foreground px-2 py-0.5 rounded">${item.kupeNo || item.animalId}</span>
                <span class="text-xs font-bold text-foreground">${item.cins}</span>
                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${item.kesimTipi && item.kesimTipi.includes('Faturalı') ? 'bg-accent/10 text-accent' : 'bg-primary/10 text-primary'}">
                  ${item.kesimTipi || 'Standart'}
                </span>
              </div>
              <p class="text-xs text-muted-foreground">Müşteri: <strong class="text-foreground">${item.musteri}</strong></p>
              <p class="text-[10px] text-muted-foreground">Tarih: ${item.tarih || '-'}</p>
            </div>
            <div class="text-right">
              <span class="text-sm font-bold text-foreground block">${item.agirlik} kg</span>
              <span class="text-xs font-bold text-success">${parseFloat(item.maliyet || 0).toLocaleString('tr-TR', {minimumFractionDigits: 2})} TL</span>
            </div>
          </div>
        `).join('');
      }

      searchInput.addEventListener('input', listeyiYukle);
      listeyiYukle();
    });
  </script>
</body>
</html>
