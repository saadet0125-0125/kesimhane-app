<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ana Sayfa — Kesimhane</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          background: 'rgb(244 247 248 / <alpha-value>)',
          foreground: 'rgb(23 36 45 / <alpha-value>)',
          primary: { DEFAULT: 'rgb(18 48 71 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          secondary: { DEFAULT: 'rgb(221 235 233 / <alpha-value>)', foreground: 'rgb(18 63 61 / <alpha-value>)' },
          accent: { DEFAULT: 'rgb(184 106 0 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
          muted: { DEFAULT: 'rgb(232 238 240 / <alpha-value>)', foreground: 'rgb(83 99 109 / <alpha-value>)' },
          card: { DEFAULT: 'rgb(255 255 255 / <alpha-value>)', foreground: 'rgb(23 36 45 / <alpha-value>)' },
          border: 'rgb(201 213 217 / <alpha-value>)',
          success: { DEFAULT: 'rgb(44 110 73 / <alpha-value>)', foreground: 'rgb(255 255 255 / <alpha-value>)' },
        },
        fontFamily: { body: ['Inter', 'system-ui'] },
        borderRadius: { DEFAULT: '14px' }
      }}
    };
  </script>
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
</head>
<body class="bg-background text-foreground min-h-screen font-body">

  <!-- GİRİŞ EKRANI (LOGIN MODAL) -->
  <div id="login-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-primary/90 p-4 backdrop-blur-sm">
    <div class="w-full max-w-sm rounded-2xl bg-card p-6 shadow-2xl border border-border">
      <div class="text-center mb-6">
        <div class="mx-auto mb-2 flex h-12 w-12 items-center justify-center rounded-xl bg-primary text-primary-foreground">
          <iconify-icon icon="lucide:lock" class="text-2xl"></iconify-icon>
        </div>
        <h2 class="text-xl font-bold text-foreground">Kesimhane Portalı</h2>
        <p class="text-xs text-muted-foreground mt-1">Devam etmek için giriş yapınız</p>
      </div>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-foreground mb-1">Kullanıcı Adı</label>
          <input type="text" id="username" required class="w-full rounded-lg border border-border p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" placeholder="admin">
        </div>
        <div>
          <label class="block text-xs font-bold text-foreground mb-1">Şifre</label>
          <input type="password" id="password" required class="w-full rounded-lg border border-border p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" placeholder="1234">
        </div>
        <button type="submit" class="w-full rounded-lg bg-primary py-3 text-sm font-bold text-primary-foreground hover:opacity-90 transition-all">Giriş Yap</button>
      </form>
    </div>
  </div>

  <!-- ANA PANEL (Giriş Yapılınca Açılır) -->
  <div id="main-panel" class="hidden min-h-screen pb-28">
    <header class="px-5 pb-4 pt-8 flex justify-between items-center">
      <div>
        <p class="text-xs font-semibold text-muted-foreground">Et Entegre Tesisi</p>
        <h1 class="text-2xl font-bold text-foreground">Ana Sayfa</h1>
      </div>
      <button id="logout-btn" class="flex items-center gap-1 text-xs font-bold text-destructive bg-card border border-border px-3 py-1.5 rounded-lg shadow-sm">
        <iconify-icon icon="lucide:log-out"></iconify-icon> Çıkış
      </button>
    </header>

    <main class="px-5 space-y-5">
      <!-- GÜNLÜK ÖZET (STANDART VE FATURALI) -->
      <section class="grid grid-cols-2 gap-3">
        <!-- Standart Kesim -->
        <div class="rounded-xl border border-border bg-card p-4 shadow-sm">
          <div class="flex items-center gap-2 mb-2">
            <div class="p-2 rounded-lg bg-secondary text-secondary-foreground">
              <iconify-icon icon="lucide:file-text" class="text-lg"></iconify-icon>
            </div>
            <span class="text-xs font-bold text-foreground">Standart Kesim</span>
          </div>
          <p class="text-xs text-muted-foreground">Adet: <strong id="stat-std-adet" class="text-foreground">0</strong></p>
          <p class="text-sm font-bold text-success mt-1" id="stat-std-tutar">0 TL</p>
        </div>

        <!-- Faturalı Kesim -->
        <div class="rounded-xl border border-border bg-card p-4 shadow-sm">
          <div class="flex items-center gap-2 mb-2">
            <div class="p-2 rounded-lg bg-accent/10 text-accent">
              <iconify-icon icon="lucide:receipt" class="text-lg"></iconify-icon>
            </div>
            <span class="text-xs font-bold text-foreground">Faturalı Kesim</span>
          </div>
          <p class="text-xs text-muted-foreground">Adet: <strong id="stat-fat-adet" class="text-foreground">0</strong></p>
          <p class="text-sm font-bold text-accent mt-1" id="stat-fat-tutar">0 TL</p>
        </div>
      </section>

      <!-- KESİM KAYDI OLUŞTURMA FORMU -->
      <section class="rounded-xl border border-border bg-card p-4 shadow-sm">
        <h2 class="text-base font-bold text-foreground mb-3 flex items-center gap-2">
          <iconify-icon icon="lucide:plus-circle" class="text-primary"></iconify-icon>
          Yeni Kesim Kaydı Oluştur
        </h2>
        
        <form id="kesim-form" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold mb-1 text-muted-foreground">Müşteri Adı Soyadı</label>
            <input type="text" id="form-musteri" required class="w-full rounded-lg border border-border p-2 text-sm focus:outline-none focus:ring-1 focus:ring-primary">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold mb-1 text-muted-foreground">Hayvan Cinsi</label>
              <select id="form-cins" class="w-full rounded-lg border border-border p-2 text-sm focus:outline-none focus:ring-1 focus:ring-primary">
                <option value="İnek">İnek</option>
                <option value="Düve">Düve</option>
                <option value="Koyun">Koyun</option>
                <option value="Tosun">Tosun</option>
                <option value="Diğer">Diğer</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold mb-1 text-muted-foreground">Kesim Tipi</label>
              <select id="form-tip" class="w-full rounded-lg border border-border p-2 text-sm focus:outline-none focus:ring-1 focus:ring-primary">
                <option value="Standart">Standart</option>
                <option value="Faturalı">Faturalı</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold mb-1 text-muted-foreground">Ağırlık (Kg)</label>
              <input type="number" id="form-agirlik" required min="1" class="w-full rounded-lg border border-border p-2 text-sm focus:outline-none focus:ring-1 focus:ring-primary">
            </div>
            <div>
              <label class="block text-xs font-semibold mb-1 text-muted-foreground">Kesim Ücreti / Maliyet (TL)</label>
              <input type="number" id="form-maliyet" required min="0" class="w-full rounded-lg border border-border p-2 text-sm focus:outline-none focus:ring-1 focus:ring-primary">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold mb-1 text-muted-foreground">Kesen Personel / Kasap</label>
            <input type="text" id="form-kesen" required placeholder="Örn: Ahmet Usta" class="w-full rounded-lg border border-border p-2 text-sm focus:outline-none focus:ring-1 focus:ring-primary">
          </div>

          <button type="submit" class="w-full rounded-lg bg-primary py-3 text-sm font-bold text-primary-foreground shadow hover:opacity-90 transition-all">
            Kesim Kaydını Tamamla ve Stoğa Aktar
          </button>
        </form>
      </section>
    </main>

    <!-- NAV -->
    <nav class="fixed inset-x-0 bottom-0 z-20 border-t border-border bg-card px-2 pb-4 pt-2 shadow-lg">
      <div class="mx-auto flex max-w-md items-center justify-between">
        <a href="ana-sayfa.html" class="flex flex-col items-center gap-1 rounded-lg bg-primary px-3 py-1.5 text-primary-foreground">
          <iconify-icon icon="lucide:house" class="text-xl"></iconify-icon>
          <span class="text-[10px] font-bold">Ana Sayfa</span>
        </a>
        <a href="kesim-listesi.html" class="flex flex-col items-center gap-1 text-muted-foreground">
          <iconify-icon icon="lucide:clipboard-list" class="text-xl"></iconify-icon>
          <span class="text-[10px] font-bold">Kesim Listesi</span>
        </a>
        <a href="stok.html" class="flex flex-col items-center gap-1 text-muted-foreground">
          <iconify-icon icon="lucide:package" class="text-xl"></iconify-icon>
          <span class="text-[10px] font-bold">Stok</span>
        </a>
        <a href="sevkiyat.html" class="flex flex-col items-center gap-1 text-muted-foreground">
          <iconify-icon icon="lucide:truck" class="text-xl"></iconify-icon>
          <span class="text-[10px] font-bold">Sevkiyat</span>
        </a>
        <a href="g-n-sonu.html" class="flex flex-col items-center gap-1 text-muted-foreground">
          <iconify-icon icon="lucide:circle-check-big" class="text-xl"></iconify-icon>
          <span class="text-[10px] font-bold">Gün Sonu</span>
        </a>
      </div>
    </nav>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const loginModal = document.getElementById('login-modal');
      const mainPanel = document.getElementById('main-panel');

      // 1. OTURUM KONTROLÜ
      if (sessionStorage.getItem('isLoggedIn') === 'true') {
        loginModal.classList.add('hidden');
        mainPanel.classList.remove('hidden');
        guncelleOzet();
      }

      // Giriş Yapma
      document.getElementById('login-form').addEventListener('submit', function (e) {
        e.preventDefault();
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;

        // Basit/Örnek Giriş Doğrulaması
        if (u && p) {
          sessionStorage.setItem('isLoggedIn', 'true');
          sessionStorage.setItem('currentUser', u);
          loginModal.classList.add('hidden');
          mainPanel.classList.remove('hidden');
          guncelleOzet();
        } else {
          alert('Lütfen kullanıcı adı ve şifre giriniz.');
        }
      });

      // Çıkış Yapma
      document.getElementById('logout-btn').addEventListener('click', function () {
        sessionStorage.removeItem('isLoggedIn');
        location.reload();
      });

      // 2. GÜNLÜK ÖZET HESAPLAMA
      function guncelleOzet() {
        const kesimler = JSON.parse(localStorage.getItem('gunlukKesimler')) || [];
        
        let stdAdet = 0, stdTutar = 0;
        let fatAdet = 0, fatTutar = 0;

        kesimler.forEach(item => {
          if (item.tip === 'Faturalı') {
            fatAdet++;
            fatTutar += parseFloat(item.maliyet || 0);
          } else {
            stdAdet++;
            stdTutar += parseFloat(item.maliyet || 0);
          }
        });

        document.getElementById('stat-std-adet').textContent = stdAdet;
        document.getElementById('stat-std-tutar').textContent = `${stdTutar.toLocaleString('tr-TR')} TL`;

        document.getElementById('stat-fat-adet').textContent = fatAdet;
        document.getElementById('stat-fat-tutar').textContent = `${fatTutar.toLocaleString('tr-TR')} TL`;
      }

      // 3. YENİ KESİM KAYDI
      document.getElementById('kesim-form').addEventListener('submit', function (e) {
        e.preventDefault();

        const gunlukKesimler = JSON.parse(localStorage.getItem('gunlukKesimler')) || [];
        const stoklar = JSON.parse(localStorage.getItem('stoklar')) || [];

        const yeniKayıt = {
          id: Date.now(),
          musteri: document.getElementById('form-musteri').value,
          cins: document.getElementById('form-cins').value,
          tip: document.getElementById('form-tip').value,
          agirlik: parseFloat(document.getElementById('form-agirlik').value),
          maliyet: parseFloat(document.getElementById('form-maliyet').value),
          kesen: document.getElementById('form-kesen').value,
          tarih: new Date().toLocaleDateString('tr-TR'),
          saat: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }),
          durum: 'stokta'
        };

        gunlukKesimler.push(yeniKayıt);
        stoklar.push(yeniKayıt);

        localStorage.setItem('gunlukKesimler', JSON.stringify(gunlukKesimler));
        localStorage.setItem('stoklar', JSON.stringify(stoklar));

        alert('Kesim kaydı oluşturuldu, Kesim Listesi ve Stoğa eklendi!');
        document.getElementById('kesim-form').reset();
        guncelleOzet();
      });
    });
  </script>
</body>
</html>
